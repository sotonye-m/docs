    get:
      tags: [Corporate Card Links]
      summary: Get Employee Card Sign-in
      description: Whether the employee has confirmed their email, set up a passkey or authenticator app, or is locked, and any email change waiting for them.
      parameters:
        - name: employee_id
          in: path
          required: true
