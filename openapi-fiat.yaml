        description: The transaction `id`, or the `transaction_id` from a `business_spend_card.transaction.*` webhook.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - invoice
              properties:
                invoice:
                  type: string
                  description: jpg, jpeg, png or pdf, up to 10 MB.
                  format: binary
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      id:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error, or the file failed the virus scan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upload Transaction Invoice
  /crypto/create-wallet:
    post:
      tags:
      - Deposits
      description: 'Returns a deposit address for one stablecoin. Pass `customer_id` for a customer''s address. Asking again for the same currency and customer returns the existing address with the message `Wallet already exists`.


        You can request at most 3 addresses a minute per customer, or for your own account. Going over blocks address requests for 24 hours. See [wallet address limits](/yativo-fiat/deposits#wallet-address-limits).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  description: '`{COIN}_{NETWORK}`.'
                  enum:
                  - USDC_SOL
                  - EURC_SOL
                  - USDT_SOL
                  - USDG_SOL
                  - PYUSD_SOL
                  - USDC_POL
                  - USDT_POL
                  example: USDC_SOL
                customer_id:
                  type: string
                  description: One of your customers. Leave it out for your own account.
                  nullable: true
              required:
              - currency
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/CryptoWallet'
        '403':
          description: Too many address requests. Address requests are blocked for 24 hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: A request for this currency is already in progress. Retry shortly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error or unsupported currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create Deposit Wallet
  /crypto/get-wallets:
    get:
      tags:
      - Deposits
      description: Lists every deposit address on your account and your customers, newest first. Store addresses and look them up here instead of requesting new ones.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Records per page.
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CryptoWallet'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '404':
          description: No wallet found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List Deposit Wallets
  /crypto/deposit-histories:
    get:
      tags:
      - Deposits
      description: Lists stablecoin deposits to every address on your account and your customers.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Records per page.
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CryptoDeposit'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
      summary: List Stablecoin Deposits
  /crypto/wallet/deposit/histories/{wallet_address}:
    get:
      tags:
      - Deposits
      description: Lists deposits to one of your addresses. An address with no deposits returns `No deposit history found for the given wallet address`.
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
          type: string
        description: One of your deposit addresses.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Records per page.
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CryptoDeposit'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: No deposits to this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List Deposits to an Address
  /payment-methods/payin/countries:
    get:
      tags:
      - Deposits
      description: Returns each country you can accept deposits from, with its currencies. `country` is the ISO 3166-1 alpha-3 code to pass to [List Pay-in Currencies](/fiat-api-reference/deposits/payin-currencies).
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                          description: ISO 3166-1 alpha-3.
                          example: BRA
                        name:
                          type: string
                          example: Brazil
                        flag:
                          type: string
                          description: Flag image URL.
                        currencies:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
      summary: List Pay-in Countries
  /payment-methods/payin/currency:
    get:
      tags:
      - Deposits
      description: Returns the deposit currencies for one country.
      parameters:
      - name: country
        in: query
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 3
          example: BRA
        description: ISO 3166-1 alpha-3, e.g. `BRA`, `MEX`, `CHL`.
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        currency_code:
                          type: string
                          example: BRL
                        currency_name:
                          type: string
                          example: Brazilian Real
                        currency_symbol:
                          type: string
                          example: R$
        '400':
          description: '`country` is missing or isn''t 3 letters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List Pay-in Currencies
  /currencies/all:
    get:
      tags:
      - Payments & Transfers
      description: Returns every currency available on Yativo.
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
      summary: List Currencies
  /sendmoney/purpose:
    post:
      tags:
      - Payments & Transfers
      description: Records the purpose of a transfer against its quote, for compliance. Call it after [Create Send Money Quote](/fiat-api-reference/payments/send-money-quote) and before [Send Money](/fiat-api-reference/payments/send-money).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quote_id:
                  type: string
                  description: The `quote_id` from Create Send Money Quote.
                transfer_purpose:
                  type: string
                  example: family_support
                transfer_memo:
                  type: string
                  example: Rent for October
                attachment:
                  type: string
                  description: URL of a supporting document, e.g. from [Upload File](/fiat-api-reference/kyc/upload).
                metadata:
                  type: object
                  additionalProperties: true
              required:
              - quote_id
              - transfer_purpose
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Add Transfer Purpose
  /business/transaction/by-currency:
    get:
      tags:
      - Transactions
      description: Lists your transactions in one currency.
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          type: string
          example: BRL
        description: Currency code, e.g. `BRL`. Defaults to `usd`.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: Records per page.
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
      summary: List Transactions by Currency
  /storage/upload:
    post:
      tags:
      - KYC / KYB
      description: 'Stores a file and returns its URL. Send it as `document`, or several as `documents[]`. Use the URL in KYC file fields such as `selfie_image` or `proof_of_address_file`.


        Files must be PDF, JPG, JPEG, PNG, HEIC or TIF. See [file rules](/yativo-fiat/kyc#upload-documents) for size limits.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  description: One file.
                  format: binary
                documents:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Several files. Each URL comes back under the same key.
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    additionalProperties:
                      type: string
                    properties:
                      document:
                        type: string
                        description: URL of the uploaded `document`.
                        example: https://storage.yativo.com/documents/abc123/passport_front.jpg
        '400':
          description: The file type isn't allowed or the file couldn't be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Upload File

tags:
  - name: Customers
    description: Create and manage customer profiles.
  - name: KYC / KYB
    description: |
      Identity verification for individual customers (KYC) and business customers (KYB).
      Submission endpoints are on `https://kyc.yativo.com/api`.
  - name: KYC Lookups
    description: |
      Lists your KYC and KYB forms need: countries, subdivisions, postal code formats, ID types,
      occupations, industries and allowed values. Served from `https://kyc.yativo.com/api`.
  - name: Payments & Transfers
    description: Exchange rates, quotes, send money, payout methods, and wallet payouts.
  - name: Deposits
    description: Initiate and retrieve payin deposits.
  - name: Virtual Accounts
    description: Issue and manage virtual bank accounts for customers.
  - name: Wallets
    description: View balances, create wallets, and list wallet payouts.
  - name: Beneficiaries
    description: Save recipients' account details as beneficiaries and reuse them in payouts.
  - name: Transactions
    description: List, retrieve, track, and download receipts for all transaction types.
  - name: Virtual Cards
    description: Activate, issue, manage, and terminate prepaid virtual cards. Every card request works only on your own cards. Any other card ID returns `404` with `Card not found`.
  - name: Payouts
    description: Single payouts to beneficiaries.
  - name: Currency Swap
    description: Swap balance between your own currency wallets.
  - name: IP Whitelist
    description: Check whether your server's IP can use your API key.
  - name: Corporate Cards
    description: Employees, their KYC, cards, card balances, memos and the USDC funding address. By invitation only.
  - name: Corporate Card Transactions
    description: Card activity on your corporate cards, with disputes, notes and invoices.
  - name: Corporate Card Links
    description: Each corporate card's employee-only page for card details and PIN, employee card sign-in, and branding.
  - name: Webhooks
    description: Register and manage webhook endpoints for real-time event notifications.
  - name: Developer
    description: Webhook event inspection.
