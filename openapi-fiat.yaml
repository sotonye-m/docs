  /corporate-card/wallet:
    get:
      tags:
      - Corporate Cards
      description: 'Returns the customer''s funding address and your USDC balance in USD. Spend only from `usdc_available_balance`: the rest is the [reserve](/yativo-fiat/sandbox-corporate-cards#reserve).


        The first request for a customer creates its address and returns `wallet: null`. Call it again to read the address. Address creation counts towards the [wallet address limits](/yativo-fiat/deposits#wallet-address-limits).


        Corporate cards are available by invitation only. Without one, this request returns `403`. See [Corporate Cards in Sandbox](/yativo-fiat/sandbox-corporate-cards).'
      parameters:
      - name: customer_id
        in: query
        required: true
        schema:
          type: string
        description: One of your business customers.
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
