  /corporate-card/employees/balance:
    post:
      tags:
      - Corporate Cards
      description: 'Moves money between your USDC balance and the employee''s balance. The employee is the cardholder, and every card they hold spends from this balance.


        `fund` debits your USDC balance and can''t use the reserve. `withdraw` returns money to your USDC balance and charges the `card_withdrawal` fee. A withdrawal larger than the employee''s available balance returns `422`. An employee with no card yet returns `404`.


        `amount` is in USD. Send `account_id` from [Get Employee Balance](/fiat-api-reference/corporate-cards/employees-balance) to target a specific account; otherwise the primary account is used.


        Corporate cards are available by invitation only. Without one, this request returns `403`. See [Corporate Cards in Sandbox](/yativo-fiat/sandbox-corporate-cards).'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  type: string
                  example: emp_456
                action:
                  type: string
                  enum:
                  - fund
                  - withdraw
                  example: fund
                amount:
                  type: number
                  description: USD, at least 0.01.
                  minimum: 0.01
                  example: 500.0
                account_id:
                  type: string
                  description: One of the employee's `accounts[].account_id`.
                  nullable: true
              required:
              - employee_id
              - action
              - amount
      responses:
        '200':
          description: The updated balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/EmployeeBalance'
        '402':
          description: Your USDC balance can't cover the amount or fee, or funding would go below the reserve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Corporate cards aren't enabled on your account, the customer has no approved `cobo_pobo` endorsement or full KYC, or the employee is suspended or terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found, or the employee has no card yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error, or the withdrawal exceeds the available balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Fund Employee
