openapi: 3.0.3
info:
  title: Yativo Fiat API
  description: |
    The Yativo Fiat API enables businesses to manage customers, run KYC/KYB, send and receive
    cross-border payments, issue virtual accounts and virtual cards, manage beneficiaries, and more.

    **Base URLs**
    | Environment | URL |
    |---|---|
    | Production | `https://api.yativo.com/api/v1` |
    | Sandbox | `https://smtp.yativo.com/api/v1` |

    **Authentication**
    Send `X-Api-Key` and `X-Api-Secret` on every request. Create keys in the dashboard under
    **Developers → API Keys**. Each key only works from the server IPs listed on it (enforced since
    14 October 2026). Keys don't expire and there's no login call or token refresh.

    Login tokens (`POST /auth/login` with an Account ID and App Secret, and `Authorization: Bearer`)
    have been discontinued and don't work for API requests.

    Endpoints that change how a person signs in (passkeys, two-factor authentication, PIN)
    or delete the account can't be called with an API key. Use the dashboard for those.
    API keys and IP whitelists can only be managed in the dashboard.

    **Rate limits**
    Per business account: 20 writes (`POST`, `PUT`, `PATCH`, `DELETE`) and 50 reads (`GET`) a second.
    Some plans set their own limit. Enterprise plans have no general limit.

    **Idempotency**
    Send an `Idempotency-Key` header on every `POST`, `PUT`, `PATCH` and `DELETE` request. A retry with
    the same key and body within 60 minutes returns the original response without running again.
    Reusing a key with a different body returns `409`.

    **KYC endpoints** are hosted on a separate platform at `https://kyc.yativo.com`. They are
    documented here for completeness but use that base URL, not the main API base.
  version: 1.0.0
  contact:
    name: Yativo Support
    url: https://yativo.com

servers:
  - url: https://api.yativo.com/api/v1
    description: Production
  - url: https://smtp.yativo.com/api/v1
    description: Sandbox

security:
  - apiKey: []
    apiSecret: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Your API key (`yativo_pk_...`) from Developers → API Keys. Send together with X-Api-Secret.
    apiSecret:
      type: apiKey
      in: header
      name: X-Api-Secret
      description: Your API secret (`yativo_sk_...`), shown once when the key is created.


  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: A unique string per request to ensure idempotent processing.

  schemas:
    WalletSwapRequest:
      type: object
      required: [from_currency, to_currency, amount]
      properties:
        from_currency:
          type: string
          description: Currency of the wallet to debit.
          example: USD
        to_currency:
          type: string
          description: Currency of the wallet to credit. Must differ from `from_currency`.
          example: USDC
        amount:
          type: number
          description: Amount to swap in `from_currency`, including the fee. Must be greater than 0.
          example: 1000
        idempotency_key:
          type: string
          maxLength: 100
          description: "`POST /wallet/swap` only. Alternative to the `Idempotency-Key` header."

    WalletSwapPair:
      type: object
      properties:
        from_currency:
          type: string
          example: USD
        to_currency:
          type: string
          example: USDC
        rate:
          type: number
          description: Units of `to_currency` per unit of `from_currency`, applied after the fee is deducted.
          example: 1
        fixed_fee:
          type: number
          description: Flat fee in `from_currency`.
          example: 0
        percent_fee:
          type: number
          description: Percentage of the amount, charged in `from_currency`.
          example: 0.5
        min_fee:
          type: number
          nullable: true
          example: 1
        max_fee:
          type: number
          nullable: true
          example:
        min_amount:
          type: number
          nullable: true
          example: 10
        max_amount:
          type: number
          nullable: true
          example: 50000

    WalletSwap:
      type: object
      properties:
        reference:
          type: string
          example: 9b1f0c52-3a8e-4f4e-b2a1-6f0e5d7c8a91
        from_currency:
          type: string
          example: USD
        to_currency:
          type: string
          example: USDC
        from_amount:
          type: number
          example: 1000
        fee:
          type: number
          example: 5
        rate:
          type: number
          example: 1
        to_amount:
          type: number
          example: 995
        status:
          type: string
          example: completed
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T10:15:00+00:00'

    FeeLine:
      type: object
      properties:
        fixed_fee:
          type: number
          description: Flat fee per transaction or action, in fee_currency.
          example: 0.5
        float_fee:
          type: number
          description: Percentage of the transaction amount (1.2 = 1.2%).
          example: 1.2
        min_charge:
          type: number
          nullable: true
          description: Lowest fee charged. null = no minimum.
          example: 1
        max_charge:
          type: number
          nullable: true
          description: Highest fee charged. null = no maximum.
          example: 50
        fee_currency:
          type: string
          example: USD
        source:
          type: string
          enum: [custom, default]
          description: custom = pricing agreed for your account. default = your plan's standard rate.
    MethodFeeLine:
      allOf:
        - type: object
          properties:
            gateway_id:
              oneOf:
                - type: integer
                - type: string
              description: The payin or payout method ID.
            method_name:
              type: string
              example: SPEI
            country:
              type: string
              example: MEX
            currency:
              type: string
              example: MXN
        - $ref: '#/components/schemas/FeeLine'
    CardLink:
      type: object
      properties:
        card_id:
          type: string
          example: 9b1d3c52-0f0e-4a8e-b0b1-6f7a1c2d3e4f
        url:
          type: string
          description: The card link. Stays the same until you replace it.
          example: https://checkout.yativo.com/card-access/cl_Vq3eX9...
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
          nullable: true
    CardAccess:
      type: object
      properties:
        employee_id:
          type: string
          example: emp_456
        email_verified:
          type: boolean
          description: The employee has confirmed their email on a card link.
        enrolled:
          type: boolean
          description: The employee has set up a passkey or authenticator app.
        methods:
          type: array
          items:
            type: string
            enum: [passkey, totp]
        locked:
          type: boolean
          description: Too many wrong attempts. Unlocks at `locked_until` or on reset.
        locked_until:
          type: string
          format: date-time
          nullable: true
        pending_email:
          type: string
          nullable: true
          description: A new email waiting for the employee to confirm on their card link.
        reset_at:
          type: string
          format: date-time
          nullable: true
    CardLinkThemeInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme
        is_default:
          type: boolean
          description: Use for every link that doesn't name another theme. Clears the flag on your other themes.
        logo_url:
          type: string
          nullable: true
          description: https URL, shown 32px tall.
          example: https://cdn.acme.com/logo.png
        font_family:
          type: string
          nullable: true
          maxLength: 64
          description: A Google Fonts family. Letters, numbers, spaces and hyphens.
          example: Inter
        radius:
          type: integer
          nullable: true
          minimum: 0
          maximum: 24
          example: 10
        colors:
          type: object
          description: Any of these keys as `#RRGGBB`. Missing colours use Yativo's defaults.
          properties:
            primary: {type: string, example: '#0A7C4B'}
            primary_text: {type: string, example: '#FFFFFF'}
            background: {type: string, example: '#F6F8F7'}
            surface: {type: string, example: '#FFFFFF'}
            text: {type: string, example: '#10231A'}
            muted: {type: string, example: '#5B6B63'}
            border: {type: string, example: '#DDE5E0'}
            error: {type: string, example: '#C62828'}
        email:
          type: object
          properties:
            sender_name:
              type: string
              nullable: true
              maxLength: 100
              example: Acme Cards
            reply_to:
              type: string
              format: email
              nullable: true
              example: cards@acme.com
            subject:
              type: string
              nullable: true
              maxLength: 150
              example: Your Acme card code
            intro:
              type: string
              nullable: true
              maxLength: 1000
            footer:
              type: string
              nullable: true
              maxLength: 1000
    CardLinkTheme:
      allOf:
        - type: object
          properties:
            theme_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        - $ref: '#/components/schemas/CardLinkThemeInput'
    # ── Generic wrappers ──────────────────────────────────────────────────────
    CorporateCardWallet:
      type: object
      properties:
        customer_id:
          type: string
          example: cus_123
        wallet_address:
          type: string
          description: USDC funding address for this customer.
          example: 7xKX...9fQe
        wallet_currency:
          type: string
          example: USDC_SOL
        wallet_status:
          type: string
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Employee:
      type: object
      properties:
        employee_id:
          type: string
          example: emp_456
        customer_id:
          type: string
          example: cus_123
        full_name:
          type: string
          example: Jane Doe
        email:
          type: string
          nullable: true
          example: jane@example.com
        dob:
          type: string
          nullable: true
          format: date
          example: '1990-04-12'
        occupation:
          type: string
          nullable: true
          example: Operations Manager
        status:
          type: string
          description: '`active`, `suspended` or `terminated`.'
          enum:
          - active
          - suspended
          - terminated
        kyc_status:
          type: string
          description: '`not_started`, `submitted`, `approved` or `rejected`.'
          enum:
          - not_started
          - submitted
          - approved
          - rejected
        kyc_reject_reason:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          example:
            department: Finance
        selfie_image:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CorporateCard:
      type: object
      properties:
        card_id:
          type: string
          description: Use this ID in every card request.
          example: 9b1f6a52-3c1e-4d0b-a8c4-2f6f0d1e7a11
        customer_id:
          type: string
          example: cus_123
        issuance_type:
          type: string
          description: '`Virtual` or `Physical`.'
          example: Virtual
        status:
          type: string
          example: ACTIVE
        masked_pan:
          type: string
          example: '**** **** **** 4242'
        expiration_date:
          type: string
          example: 2029-10
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmployeeBalance:
      type: object
      properties:
        employee_id:
          type: string
          example: emp_456
        currency:
          type: string
          example: USD
        has_cardholder:
          type: boolean
          description: '`false` until the employee''s first card is issued.'
          example: true
        available_balance:
          type: number
          description: USD.
          example: 500.0
        ledger_balance:
          type: number
          description: USD.
          example: 500.0
        balance_unavailable:
          type: boolean
          description: '`true` when a balance couldn''t be read, so the totals are incomplete.'
          example: false
        accounts:
          type: array
          items:
            type: object
            properties:
              account_id:
                type: string
              primary:
                type: boolean
              available_balance:
                type: number
                nullable: true
              ledger_balance:
                type: number
                nullable: true
              card_count:
                type: integer
    EmployeeMemo:
      type: object
      properties:
        id:
          type: integer
          example: 12
        employee_id:
          type: string
          example: emp_456
        card_id:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
          example: Client lunch
        invoice_url:
          type: string
          nullable: true
        status:
          type: string
          description: '`pending`, `approved` or `rejected`.'
          enum:
          - pending
          - approved
          - rejected
        reject_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SpendCardTransaction:
      type: object
      properties:
        id:
          type: integer
          description: The `transaction_id` in `business_spend_card.transaction.*` webhooks.
          example: 1042
        card_id:
          type: string
        employee_id:
          type: string
          nullable: true
        customer_id:
          type: string
          nullable: true
        event_type:
          type: string
        status:
          type: string
        category:
          type: string
          nullable: true
        txn_status:
          type: string
          nullable: true
        txn_description:
          type: string
          nullable: true
          example: COFFEE SHOP MIAMI FL
        amount:
          type: string
          example: '12.50'
        currency:
          type: string
          example: USD
        occurred_at:
          type: string
          format: date-time
        disputed_at:
          type: string
          nullable: true
          format: date-time
        dispute_reason:
          type: string
          nullable: true
        notes_count:
          type: integer
        invoices_count:
          type: integer
    CryptoWallet:
      type: object
      properties:
        customer_id:
          type: string
          nullable: true
        is_customer:
          type: boolean
        wallet_address:
          type: string
          example: 7TzXXXXXXXXXXXXX
        wallet_currency:
          type: string
          example: USDC_SOL
        wallet_network:
          type: string
          example: SOL
        coin_name:
          type: string
          example: USDC
        wallet_status:
          type: string
        created_at:
          type: string
          format: date-time
    CryptoDeposit:
      type: object
      properties:
        customer_id:
          type: string
          nullable: true
        currency:
          type: string
          example: USDC_SOL
        amount:
          type: string
          example: '250.00'
        address:
          type: string
          description: The wallet address that received the deposit.
        transaction_id:
          type: string
        transaction_hash:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time

    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          example: success
        status_code:
          type: integer
          example: 200
        message:
          type: string

    ErrorDetails:
      type: object
      description: Included on every failed response, with the same shape for every endpoint.
      properties:
        code:
          type: string
          enum: [bad_request, unauthenticated, payment_required, forbidden, not_found, method_not_allowed, conflict, validation_error, rate_limited, server_error, not_implemented, upstream_error, service_unavailable, upstream_timeout]
          example: validation_error
        message:
          type: string
          example: The amount field is required.
        http_status:
          type: integer
          example: 422
        fields:
          type: object
          description: Messages per field. When the error isn't about a field, the message is under `error`.
          additionalProperties:
            type: array
            items:
              type: string
        retryable:
          type: boolean
          description: "`true` for 409, 429, 500, 502, 503 and 504."
          example: false
        retry_after:
          type: integer
          nullable: true
          description: Seconds to wait before retrying, from the `Retry-After` header.

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: failed
        status_code:
          type: integer
        message:
          type: string
          example: Request failed.
        data:
          type: object
          nullable: true
          properties:
            error:
              type: string
        error_details:
          $ref: '#/components/schemas/ErrorDetails'

    ValidationError:
      type: object
      properties:
        status:
          type: string
          example: failed
        status_code:
          type: integer
          example: 422
        message:
          type: string
          example: Request failed.
        data:
          type: object
          description: The failing fields and their messages.
          additionalProperties:
            type: array
            items:
              type: string
        error_details:
          $ref: '#/components/schemas/ErrorDetails'

    Pagination:
      type: object
      properties:
        total:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        last_page:
          type: integer
        next_page_url:
          type: string
          nullable: true
        prev_page_url:
          type: string
          nullable: true

    # ── Auth ──────────────────────────────────────────────────────────────────
    # ── Customer ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        customer_phone:
          type: string
        customer_country:
          type: string
          description: ISO 3166-1 alpha-3 (e.g. USA, BRA, MEX)
        customer_type:
          type: string
          enum: [individual, business]
        customer_status:
          type: string
          example: active
        customer_kyc_status:
          type: string
          example: approved
        kyc_verified_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerAddress:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string

    # ── KYC ───────────────────────────────────────────────────────────────────
    ResidentialAddress:
      type: object
      required: [street_line_1, city, state, postal_code, country, proof_of_address_file]
      properties:
        street_line_1:
          type: string
          maxLength: 256
          description: Street address line 1. Max 256 characters.
        street_line_2:
          type: string
          description: Street address line 2. Optional.
        city:
          type: string
          maxLength: 256
          description: City. Max 256 characters.
        state:
          type: string
          description: State or province. Accepts full ISO 3166-2 codes like `"US-CA"` or the subdivision segment `"CA"` — both are normalised.
        postal_code:
          type: string
          description: Postal or ZIP code. Validated per country.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        proof_of_address_file:
          type: string
          description: Proof of address document (utility bill, bank statement, etc.). Hosted URL or base64. PDF/JPG/JPEG/PNG/HEIC/TIF, 5 KB–30 MB.

    IdentifyingInformationItem:
      type: object
      required: [type, issuing_country, number, date_issued, expiration_date, image_front_file]
      properties:
        type:
          type: string
          example: passport
          description: 'Document type. Common values: `"passport"`, `"national_id"`, `"other"`. Country-specific types also apply (e.g. `"ssn"` for US, `"bvn"` for NG).'
        issuing_country:
          type: string
          description: ISO 3166-1 alpha-2 country code of the issuing authority.
        number:
          type: string
          description: Document number.
        date_issued:
          type: string
          format: date
          description: Issue date in `YYYY-MM-DD` format. Must be before today.
        expiration_date:
          type: string
          format: date
          description: Expiration date in `YYYY-MM-DD` format. Must be after today.
        image_front_file:
          type: string
          description: Front image of the document. Hosted URL or base64. PDF/JPG/JPEG/PNG, 5 KB–30 MB.
        image_back_file:
          type: string

          description: Back image of the document. Required for documents that have a reverse side (e.g. national ID cards). Hosted URL or base64. PDF/JPG/JPEG/PNG, 5 KB–30 MB.
    KybAddress:
      type: object
      required: [street_line_1, city, state, postal_code, country, proof_of_address_file]
      properties:
        street_line_1:
          type: string
          maxLength: 255
          description: Max 255 characters.
        street_line_2:
          type: string
          maxLength: 255
          description: Max 255 characters.
        city:
          type: string
          maxLength: 100
          description: Max 100 characters.
        state:
          type: string
          description: Subdivision code from `GET /business-kyc/subdivisions/{countryCode}`, for example `"FL"`.
        postal_code:
          type: string
          description: Must match the country's format.
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        proof_of_address_file:
          type: string
          description: Hosted URL, base64 data URI or multipart file.

    KycValidationError:
      type: object
      description: Validation errors from the KYC platform.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error.
        validation_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        field_labels:
          type: object
          description: A readable name for each failing field.
          additionalProperties:
            type: string
        field_hints:
          type: object
          description: Advice for fixing a field, where available.

    UploadedDocumentItem:
      type: object
      required: [type, file]
      properties:
        type:
          type: string
          example: bank_statement
          description: A label identifying the document type, e.g. `"bank_statement"`, `"tax_return"`.
        file:
          type: string

    # ── Beneficiary ───────────────────────────────────────────────────────────
          description: Hosted URL or base64-encoded file. PDF/JPG/JPEG/PNG, 5 KB–30 MB.
    Beneficiary:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        recipient_type:
          type: string
          enum: [individual, business]
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        customer_nickname:
          type: string
        country:
          type: string
        customer_address:
          type: string
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BeneficiaryPaymentMethod:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        gateway_id:
          type: integer
        currency:
          type: string
        nickname:
          type: string
        payment_data:
          type: object
          additionalProperties: true
        beneficiary_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Virtual Account ───────────────────────────────────────────────────────
    VirtualAccount:
      type: object
      properties:
        account_id:
          type: string
        account_number:
          type: string
        account_type:
          type: string
        currency:
          type: string
        customer_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    VirtualAccountHistory:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        credited_amount:
          type: number
        transaction_id:
          type: string
        sender_name:
          type: string
        account_number:
          type: string
        transaction_fees:
          type: number
        created_at:
          type: string
          format: date-time

    # ── Wallet ────────────────────────────────────────────────────────────────
    WalletBalance:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        balance:
          type: string
        currency:
          type: string
        decimal_places:
          type: integer
        meta:
          type: object
          properties:
            logo:
              type: string
            symbol:
              type: string
            fullname:
              type: string
            precision:
              type: integer

    # ── Transaction ───────────────────────────────────────────────────────────
    Transaction:
      type: object
      properties:
        id:
          type: integer
        transaction_id:
          type: string
        transaction_amount:
          type: string
        transaction_status:
          type: string
        transaction_type:
          type: string
        transaction_memo:
          type: string
        transaction_purpose:
          type: string
        transaction_currency:
          type: string
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Virtual Card ─────────────────────────────────────────────────────────
    VirtualCard:
      type: object
      properties:
        card_id:
          type: string
        card_number:
          type: string
        expiry:
          type: string
        cvv:
          type: string
        currency:
          type: string
        balance:
          type: string
        status:
          type: string
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Payout ────────────────────────────────────────────────────────────────
    PayoutRecord:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
        beneficiary_id:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── Webhook ───────────────────────────────────────────────────────────────
    WebhookRecord:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: string
        created_at:
          type: string
          format: date-time

paths:

  /auth/occupation-codes:
    get:
      tags: [KYC / KYB]
      summary: Get Occupation Codes
      description: |
        Returns all valid occupation codes for use in the `most_recent_occupation_code`
        field of individual KYC submissions.
      responses:
        '200':
          description: List of occupation codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        display_name:
                          type: string
                          example: Software developer
                        code:
                          type: string
                          example: '151252'

  /auth/verification-locations:
    get:
      tags: [KYC / KYB]
      summary: Get Verification Locations
      description: |
        Returns all countries where Yativo supports customer registration and KYC/KYB verification.
        Use this to validate customer country selections in onboarding flows.
      responses:
        '200':
          description: List of supported countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                          example: United States
                        code:
                          type: string
                          example: US

  # ============================================================
  # CUSTOMERS
  # ============================================================

  /customer:
    get:
      tags: [Customers]
      summary: List Customers
      description: Returns all customers associated with your account, paginated and filterable.
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
          description: 'Number of records per page (default: 20).'
        - name: email
          in: query
          schema:
            type: string
          description: Filter by email (partial match).
        - name: country
          in: query
          schema:
            type: string
          description: Filter by ISO 3166-1 alpha-3 country code (e.g. `"USA"`, `"BRA"`).
        - name: kyc_status
          in: query
          schema:
            type: string
          description: Filter by KYC status.
        - name: is_kyc_approved
          in: query
          schema:
            type: boolean
          description: Filter by KYC approval status. Pass `"true"` or `"false"`.
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Customers]
      summary: Create Customer
      description: |
        Create a customer record before initiating KYC verification or payments for that customer.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, customer_email, customer_phone, customer_country, customer_type]
              properties:
                customer_name:
                  type: string
                  description: Full name of the customer (individual) or legal business name (business).
                  example: Alex Smith
                customer_email:
                  type: string
                  format: email
                  description: Customer's email address. Must be unique per account.
                  example: alex.smith@example.com
                customer_phone:
                  type: string
                  description: Customer's phone number in E.164 format (e.g. `+15551234567`).
                  example: '+15551234567'
                customer_country:
                  type: string
                  description: Customer's country of residence in ISO 3166-1 alpha-3 format (e.g. `USA`, `BRA`, `MEX`).
                  example: USA
                customer_type:
                  type: string
                  enum: [individual, business]
                  description: 'Customer type: `"individual"` or `"business"`.'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /customer/{customer_id}:
    get:
      tags: [Customers]
      summary: Get Customer
      description: |
        Returns a customer's profile. Use the `include` query parameter to embed related data:
        deposits, payouts, virtual accounts, virtual cards, and/or crypto wallets.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the customer to retrieve.
        - name: include
          in: query
          schema:
            type: string
          description: |-
            Comma-separated list of relations to embed in the response.

              | Value | Embeds |
              |---|---|
              | `deposits` | `customer_deposit` array |
              | `payouts` | `customer_payouts` array |
              | `virtualaccounts` | `customer_virtualaccounts` array |
              | `virtual_cards` | `customer_virtual_cards` array |
              | `crypto_wallets` | `customer_crypto_wallets` array |
              | `all` | All of the above |

              Multiple values can be combined: `?include=deposits,payouts`
          example: deposits,virtualaccounts
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Customers]
      summary: Update Customer
      description: |
        Full replacement of a customer's profile. All required fields must be provided on every call.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the customer to update.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, customer_name, customer_email, customer_phone, customer_country, customer_address]
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The customer ID. Must match an existing customer record.
                customer_name:
                  type: string
                  description: Full name of the customer (individual) or legal business name (business).
                customer_email:
                  type: string
                  format: email
                  description: Customer's email address.
                customer_phone:
                  type: string
                  description: Customer's phone number.
                customer_country:
                  type: string
                  description: Customer's country in ISO 3166-1 alpha-3 format (e.g. `USA`, `BRA`, `MEX`).
                customer_address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postal_code:
                      type: string
                  description: Customer's address details.
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

    delete:
      tags:
      - Customers
      description: Deletes the customer. A customer that isn't yours returns `Customer with provided ID does not exists`.
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
        description: The customer's `customer_id`.
      responses:
        '200':
          description: Request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Customer deleted successfully
        '400':
          description: The customer doesn't exist or isn't yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete Customer



  # ============================================================
  # KYC / KYB
  # ============================================================
  /customer/kyc/update:
    put:
      tags: [KYC / KYB]
      summary: Update KYC Submission
      description: |
        Update a previously submitted KYC or KYB record. Supply `customer_id` and `type`,
        then any fields to change. Fields not included are left unchanged.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, type]
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The UUID of the customer whose KYC you are updating.
                type:
                  type: string
                  enum: [individual, business]
                  description: '`"individual"` or `"business"` — must match the original submission type.'
      responses:
        '200':
          description: KYC submission updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                      type:
                        type: string
                      status:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # NOTE: KYC submission endpoints are on https://kyc.yativo.com, not the main API base.
  # They are included here for completeness with their full server override noted.

  /individual-kyc/submit:
    post:
      tags: [KYC / KYB]
      summary: Submit Individual KYC
      description: |
        **Base URL for this endpoint: `https://kyc.yativo.com/api`**

        Submit KYC data for an individual customer. The customer must already exist (via `POST /customer`).
        Status will be `submitted` then move to `approved` once review is complete.
        Requires an `Idempotency-Key` header.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - first_name
                - last_name
                - email
                - calling_code
                - phone
                - birth_date
                - nationality
                - gender
                - taxId
                - selfie_image
                - residential_address
                - identifying_information
                - employment_status
                - most_recent_occupation_code
                - expected_monthly_payments_usd
                - source_of_funds
                - account_purpose
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The customer UUID returned by `POST /customer`.
                first_name:
                  type: string
                  maxLength: 1024
                  description: Customer's first name. Max 1024 characters.
                last_name:
                  type: string
                  maxLength: 1024
                  description: Customer's last name. Max 1024 characters.
                middle_name:
                  type: string
                  description: Customer's middle name. Optional.
                email:
                  type: string
                  format: email
                  description: Customer's email address.
                calling_code:
                  type: string
                  pattern: '^\+\d{1,4}$'
                  example: '+1'
                  description: Country dial code. Must match `^\+\d{1,4}$`, e.g. `"+1"`, `"+44"`, `"+234"`.
                phone:
                  type: string
                  description: Phone number digits only, 8–15 characters. Do not include the country code.
                  minLength: 8
                  maxLength: 15
                birth_date:
                  type: string
                  format: date
                  description: Date of birth in `YYYY-MM-DD` format. The customer must be at least 18.
                nationality:
                  type: string
                  description: ISO 3166-1 alpha-2 country code, e.g. `"US"`, `"NG"`, `"BR"`.
                  minLength: 2
                  maxLength: 2
                gender:
                  type: string
                  enum: [male, female]
                  description: '`"male"` or `"female"`.'
                taxId:
                  type: string
                  maxLength: 255
                  pattern: '^[A-Za-z0-9]+$'
                  description: Tax identification number. Letters and digits only, up to 255 characters. Send `"123456789"`, not `"123-45-6789"`.
                selfie_image:
                  type: string
                  description: 'Selfie photo of the customer. Provide as a hosted URL (from `POST /storage/upload`) or a base64-encoded string. Accepted formats: PDF, JPG, JPEG, PNG, HEIC, TIF, between 5 KB and 30 MB.'
                bvn:
                  type: string
                  description: Bank Verification Number. **Required when `nationality` or `residential_address.country` is `"NG"`**. Exactly 11 digits.
                  minLength: 11
                  maxLength: 11
                nin:
                  type: string
                  description: National Identification Number. **Required when `nationality` or `residential_address.country` is `"NG"`**. Exactly 11 digits.
                  minLength: 11
                  maxLength: 11
                residential_address:
                  $ref: '#/components/schemas/ResidentialAddress'
                  description: Customer's current residential address.
                identifying_information:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/IdentifyingInformationItem'
                  description: At least one government-issued ID document. Accepted document types depend on `issuing_country` — see the [ID types reference](/yativo-fiat/kyc#id-types-by-country).
                employment_status:
                  type: string
                  description: Lookup key such as `SelfEmployed`, or its snake_case form `self_employed`.
                most_recent_occupation_code:
                  type: string
                  description: '6-digit occupation code. Retrieve the full list from `GET /auth/occupation-codes`. Example: `"151252"` (Software developer).'
                  example: '151252'
                expected_monthly_payments_usd:
                  type: string
                  description: Lookup key such as `LessThan5K`, or its value `0_4999`.
                source_of_funds:
                  type: string
                  description: Lookup key from GET /individual-kyc/source-of-funds, or its snake_case form.
                account_purpose:
                  type: string
                  description: Lookup key from GET /individual-kyc/account-purposes, or its snake_case form.
                account_purpose_other:
                  type: string
                  description: Required when `account_purpose` is `"other"`. Provide a plain-text description.
                acting_as_intermediary:
                  type: boolean
                  default: false
                  description: Set to `true` if the customer is acting on behalf of third parties. Defaults to `false`.
                annual_salary:
                  type: string
                  maxLength: 20
                  description: Optional. Up to 20 characters.
                current_employer:
                  type: string
                  maxLength: 512
                  description: Optional. Up to 512 characters.
                immigration_status:
                  type: string
                  enum: [Permanent U.S. Resident, Non-Permanent U.S. Resident, Non-Resident of U.S.]
                  description: Optional. `"Permanent U.S. Resident"`, `"Non-Permanent U.S. Resident"` or `"Non-Resident of U.S."`
                usd_virtual_account:
                  type: boolean
                  description: 'Also `eur_virtual_account`, `gbp_virtual_account` and `native_endorsement`: the services to verify the customer for. See [Virtual account flags](/yativo-fiat/kyc#virtual-account-flags).'
                eur_virtual_account:
                  type: boolean
                gbp_virtual_account:
                  type: boolean
                native_endorsement:
                  type: boolean
                uploaded_documents:
                  type: array
                  items:
                    $ref: '#/components/schemas/UploadedDocumentItem'
                  description: At least one supporting document is required.
      responses:
        '201':
          description: KYC submitted. Verification runs afterwards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: KYC submitted successfully.
                  data:
                    type: object
                    description: The saved submission.
                    properties:
                      customer_id:
                        type: string
                      type:
                        type: string
                        example: individual
                      status:
                        type: string
                        example: submitted
                      submitted_at:
                        type: string
                        format: date-time
                  warnings:
                    type: object
                    description: Fields verification is likely to reject, such as values not on the lookup lists. Only present when there are warnings.
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycValidationError'

  /business-kyc/submit:
    post:
      tags: [KYC / KYB]
      summary: Submit Business KYB
      description: |
        **Base URL for this endpoint: `https://kyc.yativo.com/api`**

        Submit KYB data for a business customer. The customer must already exist with
        `customer_type: "business"`, or the request returns `404`. A successful response means the data
        was accepted. Verification runs afterwards.

        Associated persons below `ownership_threshold` (default 25) are dropped, unless they're a director,
        signer or controller (`is_director`, `is_signer` or `has_control` true). At least one person must
        meet the threshold, and the combined ownership of persons with `has_ownership: true` can't exceed 100.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - business_legal_name
                - business_trade_name
                - business_description
                - email
                - business_type
                - registration_number
                - incorporation_date
                - primary_website
                - registered_address
                - physical_address
                - associated_persons
                - account_purpose
                - source_of_funds
                - expected_monthly_payments_usd
                - high_risk_activities
                - pep_status
                - third_party_msb_payments
                - documents
                - extra_documents
              properties:
                customer_id:
                  type: string
                  description: The customer ID returned by `POST /customer`.
                business_legal_name:
                  type: string
                  maxLength: 255
                  description: Registered legal name. Max 255 characters.
                business_trade_name:
                  type: string
                  maxLength: 255
                  description: Trade or DBA name. Max 255 characters.
                business_description:
                  type: string
                  minLength: 140
                  maxLength: 5000
                  description: What the business does. 140–5000 characters.
                email:
                  type: string
                  format: email
                  description: Business contact email.
                business_type:
                  type: string
                  enum: [cooperative, corporation, llc, partnership, sole_prop, trust, other]
                  description: '`cooperative`, `corporation`, `llc`, `partnership`, `sole_prop`, `trust` or `other`.'
                registration_number:
                  type: string
                  maxLength: 100
                  description: Government registration or incorporation number. Max 100 characters.
                incorporation_date:
                  type: string
                  format: date
                  description: '`YYYY-MM-DD`, before today.'
                incorporation_country:
                  type: string
                  description: ISO 3166-1 alpha-2 country code.
                tax_id:
                  type: string
                  maxLength: 255
                  pattern: '^[A-Za-z0-9]+$'
                  description: Business tax ID. Required unless you send `identifying_information`. Letters and digits only, up to 255 characters.
                phone_calling_code:
                  type: string
                  pattern: '^\+[1-9]\d{0,3}$'
                  description: Must match `^\+[1-9]\d{0,3}$`, for example `"+1"`.
                phone_number:
                  type: string
                  pattern: '^\d{7,15}$'
                  description: Digits only, 7–15 characters.
                business_industry:
                  type: string
                  description: Industry, from `GET /business-industries`.
                primary_website:
                  type: string
                  format: uri
                  description: Website URL including the scheme, for example `https://acme.com`.
                is_dao:
                  type: boolean
                  description: Whether the business is a decentralized autonomous organization.
                statement_descriptor:
                  type: string
                  maxLength: 22
                  description: How the name appears on statements. Max 22 characters.
                registered_address:
                  $ref: '#/components/schemas/KybAddress'
                  description: The registered address. `physical_address` has the same fields and is also required.
                physical_address:
                  $ref: '#/components/schemas/KybAddress'
                  description: The operating address. Same fields as `registered_address`.
                associated_persons:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [first_name, last_name, birth_date, nationality, email, ownership_percentage, residential_address, identifying_information]
                    properties:
                      first_name:
                        type: string
                        maxLength: 100
                        description: Max 100 characters.
                      last_name:
                        type: string
                        maxLength: 100
                        description: Max 100 characters.
                      birth_date:
                        type: string
                        format: date
                        description: '`YYYY-MM-DD`. The person must be at least 18.'
                      nationality:
                        type: string
                        description: ISO 3166-1 alpha-2.
                      email:
                        type: string
                        format: email
                        description: Personal email.
                      phone:
                        type: string
                        pattern: '^\d{7,15}$'
                        description: Digits only, 7–15 characters.
                      title:
                        type: string
                        description: For example `"CEO"`.
                      ownership_percentage:
                        type: number
                        minimum: 0
                        maximum: 100
                        description: 0–100.
                      tax_id:
                        type: string
                        pattern: '^[A-Za-z0-9]+$'
                        description: Personal tax ID. Letters and digits only.
                      annual_salary:
                        type: string
                        maxLength: 20
                        description: Up to 20 characters.
                      relationship_established_at:
                        type: string
                        format: date
                        description: '`YYYY-MM-DD`, not in the future.'
                      residential_address:
                        $ref: '#/components/schemas/KybAddress'
                        description: Same fields as `registered_address`, including `proof_of_address_file`.
                      identifying_information:
                        type: array
                        minItems: 1
                        description: At least one entry that isn't a tax ID.
                        items:
                          type: object
                          required: [type, number, image_front]
                          properties:
                            type:
                              type: string
                              example: passport
                              description: For example `passport`, `national_id`, `drivers_license` or `tax_id`.
                            number:
                              type: string
                              description: Document number. For `tax_id`, letters and digits only.
                            issuing_country:
                              type: string
                              description: ISO 3166-1 alpha-2.
                            expiration:
                              type: string
                              format: date
                              description: '`YYYY-MM-DD`, after today.'
                            image_front:
                              type: string
                              description: File. Not required for tax_id.
                            image_back:
                              type: string
                              description: Back of the document. Required except for `passport` and `tax_id`.
                      has_ownership:
                        type: boolean
                        description: Has an ownership stake.
                      has_control:
                        type: boolean
                        description: Has operational control.
                      is_signer:
                        type: boolean
                        description: Authorized signer. A signer who isn't a director requires a `board_resolution` in `extra_documents`.
                      is_director:
                        type: boolean
                        description: Director.
                  description: "Owners, directors and authorized signers. At least one person must own at least `ownership_threshold` percent (default 25). People below the threshold are dropped from the submission, unless `is_director`, `is_signer` or `has_control` is true. The role flags accept `true`/`false`, `1`/`0` and `\"1\"`/`\"0\"`. The combined `ownership_percentage` of people with `has_ownership: true` can't exceed 100."
                account_purpose:
                  type: string
                  enum: [charitable_donations, ecommerce_retail_payments, investment_purposes, other, payments_to_friends_or_family_abroad, payroll, personal_or_living_expenses, protect_wealth, purchase_goods_and_services, receive_payments_for_goods_and_services, tax_optimization, third_party_money_transmission, treasury_management]
                  description: One of `charitable_donations`, `ecommerce_retail_payments`, `investment_purposes`, `other`, `payments_to_friends_or_family_abroad`, `payroll`, `personal_or_living_expenses`, `protect_wealth`, `purchase_goods_and_services`, `receive_payments_for_goods_and_services`, `tax_optimization`, `third_party_money_transmission` or `treasury_management`.
                account_purpose_other:
                  type: string
                  description: Required when `account_purpose` is `other`.
                source_of_funds:
                  type: string
                  enum: [BusinessLoans, Grants, InterCompanyFunds, InvestmentProceeds, LegalSettlement, OwnersCapital, PensionRetirement, SaleOfAssets, SalesOfGoodsAndServices, ThirdPartyFunds, TreasuryReserves]
                  description: PascalCase. One of `BusinessLoans`, `Grants`, `InterCompanyFunds`, `InvestmentProceeds`, `LegalSettlement`, `OwnersCapital`, `PensionRetirement`, `SaleOfAssets`, `SalesOfGoodsAndServices`, `ThirdPartyFunds` or `TreasuryReserves`.
                expected_monthly_payments_usd:
                  type: integer
                  minimum: 1
                  description: Expected monthly volume in USD. At least 1.
                high_risk_activities:
                  type: array
                  items:
                    type: string
                    enum: [adult_entertainment, gambling, hold_client_funds, investment_services, lending_banking, marijuana_or_related_services, money_services, nicotine_tobacco_or_related_services, operate_foreign_exchange_virtual_currencies_brokerage_otc, pharmaceuticals, precious_metals_precious_stones_jewelry, safe_deposit_box_rentals, third_party_payment_processing, weapons_firearms_and_explosives, none_of_the_above]
                  description: Any of `adult_entertainment`, `gambling`, `hold_client_funds`, `investment_services`, `lending_banking`, `marijuana_or_related_services`, `money_services`, `nicotine_tobacco_or_related_services`, `operate_foreign_exchange_virtual_currencies_brokerage_otc`, `pharmaceuticals`, `precious_metals_precious_stones_jewelry`, `safe_deposit_box_rentals`, `third_party_payment_processing`, `weapons_firearms_and_explosives`. Send `["none_of_the_above"]` if none apply.
                high_risk_activities_explanation:
                  type: string
                  maxLength: 5000
                  description: Required if any high-risk activity is listed. Max 5000 characters.
                pep_status:
                  type: boolean
                  description: Whether any associated person is a politically exposed person.
                third_party_msb_payments:
                  type: boolean
                  description: Whether the business makes payments for third-party money services businesses.
                conducts_money_services:
                  type: boolean
                  description: When `true`, `conducts_money_services_description` and `compliance_screening_explanation` are required.
                conducts_money_services_description:
                  type: string
                compliance_screening_explanation:
                  type: string
                estimated_annual_revenue_usd:
                  type: string
                  description: Estimated annual revenue in USD.
                operates_in_prohibited_countries:
                  type: string
                  enum: ['yes', 'no']
                  description: '`yes` or `no`.'
                ownership_threshold:
                  type: integer
                  minimum: 5
                  maximum: 100
                  default: 25
                  description: 5–100. Default 25.
                has_material_intermediary_ownership:
                  type: boolean
                  description: Whether the ownership includes material intermediary entities.
                regulated_activity:
                  type: object
                  properties:
                    regulated_activities_description:
                      type: string
                    primary_regulatory_authority_country:
                      type: string
                    primary_regulatory_authority_name:
                      type: string
                    license_number:
                      type: string
                  description: '`regulated_activities_description`, `primary_regulatory_authority_country`, `primary_regulatory_authority_name` and `license_number`, if the business is regulated.'
                documents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purpose, description, file]
                    properties:
                      purpose:
                        type: string
                        enum: [business_registration, proof_of_address, tax_documents, compliance_documents, financial_statements, certificate_of_good_standing, portfolio_statement, board_minutes]
                        description: '`business_registration`, `proof_of_address`, `tax_documents`, `compliance_documents`, `financial_statements`, `certificate_of_good_standing`, `portfolio_statement` or `board_minutes`.'
                      description:
                        type: string
                        description: For example `"Certificate of Incorporation"`.
                      file:
                        type: string
                        description: The document.
                  description: At least one document.
                extra_documents:
                  type: array
                  description: "Items of `{ \"type\": \"...\", \"file\": ... }`. Must include `shareholding_structure`, and `board_resolution` when an authorized signer isn't a director."
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: shareholding_structure
                      file:
                        type: string
                identifying_information:
                  type: array
                  description: Business-level documents with `type`, `issuing_country`, `number`, `description`, `expiration`, `image_front` and `image_back`. `image_front` is required when `type` is `tax_id`.
                  items:
                    type: object
                usd_virtual_account:
                  type: boolean
                  description: Also `eur_virtual_account`, `gbp_virtual_account` and `native_endorsement`. See [Virtual account flags](/yativo-fiat/kyc#virtual-account-flags).
                eur_virtual_account:
                  type: boolean
                gbp_virtual_account:
                  type: boolean
                native_endorsement:
                  type: boolean
                extra_business_info:
                  type: object
                  description: Optional business profile. Values outside the allowed lists come back in warnings.
                  properties:
                    meeting_mode: {type: string, maxLength: 255}
                    industry_vertical: {type: string, maxLength: 255, example: Ecommerce - Consumer Electronics}
                    business_description: {type: string, minLength: 140, maxLength: 5000}
                    obo_usage: {type: string, enum: ['yes', 'no']}
                    monthly_volume_usd: {type: number}
                    avg_transaction_usd: {type: number}
                    max_transaction_usd: {type: number}
                    primary_account_purpose: {type: string, maxLength: 255}
                    sender_geographies:
                      type: array
                      items: {type: string, enum: [Africa, Europe, North America, South America, Asia]}
                collections_data:
                  type: object
                  properties:
                    sender_industries:
                      type: array
                      items: {type: string, enum: [E-commerce, Wholesale, Retail, Logistics, Manufacturing, Consulting, Others]}
                    sender_types: {type: string, enum: [individuals, business, businesses, both]}
                    top_5_senders: {type: array, maxItems: 5, items: {type: string}}
                    incoming_from_fintech_wallets: {type: boolean}
                    incoming_fintech_wallet_details: {type: string, maxLength: 1000}
                    collection_currencies: {type: array, items: {type: string}, description: Codes from GET /transaction-currencies.}
                    current_collection_provider: {type: string}
                    reason_for_switching_collection: {type: string}
                    expected_monthly_disbursement_usd: {type: number}
                    avg_transaction_amount_collection: {type: number}
                    max_transaction_amount_collection: {type: number}
                payouts_data:
                  type: object
                  properties:
                    payout_primary_purpose: {type: string, maxLength: 255}
                    beneficiary_geographies: {type: array, items: {type: string}, description: Enabled codes from GET /transaction-countries.}
                    beneficiary_industries: {type: array, items: {type: string}}
                    beneficiary_types: {type: string, enum: [individual, individuals, business, both]}
                    top_5_beneficiaries: {type: array, maxItems: 5, items: {type: string}}
                    primary_payout_method: {type: string, enum: [ach, wire, sepa, swift, local_transfer, mobile_money, crypto]}
                    payout_currencies: {type: array, items: {type: string}}
                    current_payout_provider: {type: string}
                    reason_for_switching_payout: {type: string}
      responses:
        '200':
          description: KYB data accepted. Verification runs afterwards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: All data submitted successfully.
                  business_data:
                    type: object
        '404':
          description: Business with the provided Customer_ID not found.
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycValidationError'

  # ============================================================
  # KYC LOOKUPS (KYC platform)
  # ============================================================

  /countries:
    get:
      tags: [KYC Lookups]
      summary: List Countries
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Every country you can send in KYC and KYB fields such as `nationality`, `country` and
        `issuing_country`. Send the two-letter `code`. Sorted by name.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Countries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: {type: string, example: US, description: ISO 3166-1 alpha-2. Send this value.}
                    iso3: {type: string, example: USA}
                    name: {type: string, example: United States}
              example:
                - {code: AF, iso3: AFG, name: Afghanistan}
                - {code: AL, iso3: ALB, name: Albania}

  /subdivisions/{countryCode}:
    get:
      tags: [KYC Lookups]
      summary: List Subdivisions
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        States, provinces or regions for a country. Send `code` as the `state` of an address.
        Returns an empty array for an unknown country. Also available as
        `GET /subdivisions/states/{countryCode}`, `GET /individual-kyc/subdivisions/{countryCode}`
        and `GET /business-kyc/subdivisions/{countryCode}`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: countryCode
          in: path
          required: true
          description: ISO 3166-1 alpha-2 country code.
          schema: {type: string, example: US}
      responses:
        '200':
          description: Subdivisions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: {type: string, example: CA, description: Send this value as `state`.}
                    name: {type: string, example: California}
                    subdivision_code: {type: string, example: CA}
              example:
                - {code: AL, name: Alabama, subdivision_code: AL}
                - {code: AK, name: Alaska, subdivision_code: AK}

  /postal-codes/{countryCode}:
    get:
      tags: [KYC Lookups]
      summary: Get Postal Code Format
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Whether a country uses postal codes, and the pattern and sample values to validate
        `postal_code` before you submit.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: countryCode
          in: path
          required: true
          description: ISO 3166-1 alpha-2 country code.
          schema: {type: string, example: US}
      responses:
        '200':
          description: Postal code format
          content:
            application/json:
              schema:
                type: object
                properties:
                  country_code: {type: string, example: US}
                  country_name: {type: string, example: United States}
                  uses_postal_codes: {type: boolean, example: true}
                  validation:
                    type: object
                    properties:
                      rule_regex: {type: string, nullable: true, example: '/^\d{5}(?:-\d{4})?$/'}
                      rule_samples:
                        type: array
                        items: {type: string}
                        example: ['12345', '12345-6789']
                      addressing_pattern: {type: string, nullable: true}

  /identification-types/{countryCode}:
    get:
      tags: [KYC Lookups]
      summary: List ID Types
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        The ID document `type` values accepted for a country, including tax ID types. Use them for
        `identifying_information[].type`. A country without a list returns only `other`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: countryCode
          in: path
          required: true
          description: ISO 3166-1 alpha-2 country code of the issuing country.
          schema: {type: string, example: NG}
      responses:
        '200':
          description: ID types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type: {type: string, example: passport, description: Send this value as `type`.}
                    description: {type: string, example: Passport}
              example:
                - {type: bvn, description: Bank Verification Number}
                - {type: national_id, description: National ID}
                - {type: nin, description: National Identification Number}
                - {type: other, description: Other Government Issued ID}
                - {type: passport, description: Passport}
                - {type: tin, description: Tax Identification Number}

  /occupations:
    get:
      tags: [KYC Lookups]
      summary: List Occupations
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Occupation codes for `most_recent_occupation_code` in individual KYC. Send `code`.
        Sorted by name. The list is long, so offer a searchable field.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Occupations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    occupation: {type: string, example: Accountant and auditor}
                    code: {type: string, example: '132011', description: Send this value.}
              example:
                - {occupation: Accountant and auditor, code: '132011'}
                - {occupation: Actor, code: '272011'}

  /business-industries:
    get:
      tags: [KYC Lookups]
      summary: List Business Industries
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Industries for `business_industry` in KYB. Send `code`. Sorted by name.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Industries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    occupation: {type: string, example: Soybean Farming, description: The industry name.}
                    code: {type: string, example: '111110'}

  /individual-kyc/account-purposes:
    get:
      tags: [KYC Lookups]
      summary: List Account Purposes (Individual)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Values for `account_purpose` in individual KYC, as a map of key to label. Send the key, such as
        `ReceiveSalary`. Its snake_case form, `receive_salary`, also works.
        Also available as `GET /account-purposes`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Account purposes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
              example:
                CharitableDonations: Charitable Donations
                ReceiveSalary: Receive Salary

  /individual-kyc/source-of-funds:
    get:
      tags: [KYC Lookups]
      summary: List Sources of Funds (Individual)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Values for `source_of_funds` in individual KYC, as a map of key to label. Send the key, such as
        `Salary`. Its snake_case form, `salary`, also works.
        Also available as `GET /source-of-funds`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Sources of funds
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
              example:
                CompanyFunds: Company Funds
                Salary: Salary

  /business-kyc/account-purposes:
    get:
      tags: [KYC Lookups]
      summary: List Account Purposes (Business)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Values for `account_purpose` in KYB. The keys are the values to send. This list differs from
        the individual one.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Account purposes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
              example:
                charitable_donations: Charitable Donations
                receive_payments_for_goods_and_services: Receive Payments For Goods And Services

  /business-kyc/source-of-funds:
    get:
      tags: [KYC Lookups]
      summary: List Sources of Funds (Business)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Values for `source_of_funds` in KYB. The keys are the PascalCase values to send. This list
        differs from the individual one.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Sources of funds
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
              example:
                BusinessLoans: Business Loans
                SalesOfGoodsAndServices: Sales Of Goods And Services

  /individual-kyc/expected-monthly-payments-usd:
    get:
      tags: [KYC Lookups]
      summary: List Expected Monthly Payment Ranges
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Ranges for `expected_monthly_payments_usd` in individual KYC. Send the key, such as `LessThan5K`.
        The value, such as `0_4999`, also works.
        Returned in ascending order. Also available as `GET /expected-monthly-payments-usd`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Ranges
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
              example:
                LessThan5K: 0_4999
                From5KTo10K: 5000_9999
                From10KTo50K: 10000_49999
                GreaterThan50K: 50000_plus

  /transaction-currencies:
    get:
      tags: [KYC Lookups]
      summary: List Transaction Currencies
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Currencies for the KYB `collection_currencies` field. Send `code`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: {type: string, example: AED}
                    name: {type: string, example: United Arab Emirates Dirham}

  /transaction-countries:
    get:
      tags: [KYC Lookups]
      summary: List Transaction Countries
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Countries for the KYB `beneficiary_geographies` field. Only countries with `status: enabled`
        are accepted. Send `code`.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      responses:
        '200':
          description: Countries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: {type: string, example: AF}
                    iso3: {type: string, example: AFG}
                    name: {type: string, example: Afghanistan}
                    status: {type: string, enum: [enabled, disabled], example: enabled}

  /individual-kyc/{customerId}:
    patch:
      tags: [KYC / KYB]
      summary: Update Individual KYC (Partial)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Change some fields of an individual KYC submission. Send only the fields you're changing,
        with the same names and rules as Submit Individual KYC. `state` and `postal_code` are checked
        against the country's subdivision and postal code formats.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any fields from Submit Individual KYC.
              additionalProperties: true
            example:
              residential_address:
                street_line_1: 742 Evergreen Terrace
                city: Springfield
                state: IL
                postal_code: '62704'
                country: US
      responses:
        '200':
          description: Updated
        '400':
          description: No fields provided.
        '404':
          description: Customer submission not found.
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycValidationError'

  /business-kyc/{customerId}:
    patch:
      tags: [KYC / KYB]
      summary: Update Business KYB (Partial)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Change some fields of a KYB submission. Send only the fields you're changing, with the same
        names and rules as Submit Business KYB.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any fields from Submit Business KYB.
              additionalProperties: true
            example:
              primary_website: https://acmepay.com
      responses:
        '200':
          description: Updated
        '404':
          description: Business not found.
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycValidationError'

  /customer/kyc/resubmit/{customerId}/{endorsement}:
    post:
      tags: [KYC / KYB]
      summary: Resubmit Endorsement
      description: |
        Re-run verification for one endorsement of an individual customer, for example after they
        update their ID document or selfie. Other endorsements aren't affected. A `200` means the
        resubmission was queued. Watch `endorsement.updated` for the result.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: customerId
          in: path
          required: true
          schema: {type: string}
        - name: endorsement
          in: path
          required: true
          description: The endorsement to re-run. Case doesn't matter, so `SEPA` and `sepa` both work.
          schema:
            type: string
            enum: [base, sepa, spei, faster_payments, naira, virtual_card, asian, brazil]
      responses:
        '200':
          description: Resubmission queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: success}
                  status_code: {type: integer, example: 200}
                  message: {type: string, example: Request successful}
                  data:
                    type: object
                    properties:
                      message: {type: string, example: 'KYC resubmission for "faster_payments" queued.'}
        '404':
          description: Customer not found, or no KYC submission yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Business customer, or unsupported endorsement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/virtual-account/currencies-and-endorsements:
    get:
      tags: [Virtual Accounts]
      summary: List Currencies and Endorsements
      description: |
        Every virtual account currency code your account can use, and the endorsement a customer
        needs approved before you can issue that currency.
      responses:
        '200':
          description: Currencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: success}
                  status_code: {type: integer, example: 200}
                  message: {type: string, example: Request successful}
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        currency: {type: string, example: USDBASE}
                        endorsement: {type: string, nullable: true, example: base}

  /kyc/endorsements/{customerId}/{service}/resubmit:
    post:
      tags: [KYC / KYB]
      summary: Resubmit Endorsement (KYC Platform)
      description: |
        **Base URL: `https://kyc.yativo.com/api`**

        Resubmit a customer's stored KYC or KYB for one endorsement. Works for individual and business
        customers. The endorsement moves to `under_review` and its `errors` are cleared. If the data can't be
        submitted, it returns to its previous status and `errors.resubmission_failed` says why.
        Limited to 30 requests a minute.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: string}
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum: [base, sepa, eurde, spei, asian, virtual_card, naira, cobo_pobo, faster_payments, native, brazil, usd_latam, eur_latam]
        - name: X-Resubmit-Token
          in: header
          required: false
          description: Only when resubmit protection is enabled on your account.
          schema: {type: string}
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: true}
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      customer_id: {type: string}
                      service: {type: string, example: cobo_pobo}
                      status: {type: string, example: under_review}
        '403':
          description: Resubmit token missing or wrong
        '404':
          description: No stored submission for this customer
        '409':
          description: The endorsement is already approved
        '422':
          description: Unknown endorsement

  /kyc/regenerate/{customerId}/{service}:
    get:
      tags: [KYC / KYB]
      summary: Regenerate Endorsement Link
      description: |
        **Base URL for this endpoint: `https://kyc.yativo.com/api`**

        Generate a fresh verification link for an expired service endorsement.
        Share the new link with the customer to complete verification for the specific payment service.

        **Services:** `base`, `sepa`, `spei`, `brazil`, `eurde`, `usd_latam`, `eur_latam`,
        `virtual_card`, `asian`, `native`, `cobo_pobo`
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform (production)
        - url: https://kyc-sandbox.yativo.com/api
          description: KYC Platform (sandbox)
      security: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the customer.
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum: [base, sepa, spei, brazil, eurde, usd_latam, eur_latam, virtual_card, asian, native, cobo_pobo]
          description: 'The service endorsement to regenerate. One of: `base`, `sepa`, `spei`, `brazil`, `eurde`, `usd_latam`, `eur_latam`, `virtual_card`, `asian`, `native`, `cobo_pobo`.'
      responses:
        '200':
          description: Endorsement link regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                      service:
                        type: string
                      link:
                        type: string
                      expires_at:
                        type: string
                        format: date-time

  # ============================================================
  # PAYMENTS & TRANSFERS
  # ============================================================

  /exchange-rate:
    post:
      tags: [Payments & Transfers]
      summary: Get Exchange Rate / Create Quote
      description: |
        Returns a real-time exchange rate, fee breakdown, and a `quote_id` valid for **5 minutes**.
        Pass the `quote_id` to `POST /wallet/payout` or `POST /wallet/deposits/new` to execute the
        transaction at the quoted rate. Rate-limited to **30 requests per minute**.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_currency, to_currency, amount]
              properties:
                from_currency:
                  type: string
                  description: Source currency code (ISO 4217), e.g. `"USD"`, `"EUR"`.
                  example: USD
                to_currency:
                  type: string
                  description: Target currency code (ISO 4217), e.g. `"USD"`, `"CLP"`, `"BRL"`, `"MXN"`.
                  example: CLP
                amount:
                  type: number
                  description: 'Amount in the source currency to convert. With `amount_type: "receive"`, the amount the customer receives in `to_currency`.'
                  example: 500
                method_id:
                  type: integer
                  description: The payment method ID (from `GET /payment-methods/payout` or `GET /payment-methods/payin`). When provided, the quote is scoped to that specific payment rail and its exact fee structure is applied.
                method_type:
                  type: string
                  enum: [payout, payin]
                  description: 'Transaction direction: `"payout"` (for sends/withdrawals) or `"payin"` (for deposits). Required when `method_id` is provided.'
                amount_type:
                  type: string
                  enum: [send, receive]
                  default: send
                  description: |-
                    Payout quotes only. `send` (default): `amount` is what leaves your wallet. `receive`: `amount` is what the customer receives, and the quote works out the send amount and fees. Using `receive` with `method_type: "payin"` returns `422`. See [Pay out by receive amount](/yativo-fiat/exchange-rates#pay-out-by-receive-amount).
      responses:
        '200':
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      quote_id:
                        type: string
                        format: uuid
                        description: Valid for 5 minutes. Use in payout or deposit execution.
                      quote_expire_at:
                        type: string
                        format: date-time
                        description: When the quote expires.
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      rate:
                        type: string
                      amount:
                        type: string
                        description: The send amount, in from_currency. Calculated for you in receive mode.
                      amount_type:
                        type: string
                        enum: [send, receive]
                        description: Payout quotes only.
                      receive_amount:
                        type: string
                        description: Only in receive mode. The amount the customer receives, in to_currency.
                      payout_data:
                        type: object
                        properties:
                          total_transaction_fee_in_from_currency:
                            type: string
                          total_transaction_fee_in_to_currency:
                            type: string
                          customer_sent_amount:
                            type: string
                          customer_receive_amount:
                            type: string
                          customer_total_amount_due:
                            type: string
                      calculator:
                        type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid amount_type, or amount_type receive on a payin quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (30 requests/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exchange-rates:
    get:
      tags: [Payments & Transfers]
      summary: Get Market Rates
      description: |
        Current indicative market rate for every wallet currency Yativo supports, quoted as
        "1 `base` = `rate` units of that currency". Rates refresh about once a minute and don't
        include fees. To price a specific payout or deposit with fees, use `POST /exchange-rate`.

        Limited to **one request per minute** per account. Team members need the
        **Currency Exchange → view** permission.
      parameters:
        - name: base
          in: query
          required: false
          description: The currency rates are quoted against. Must be a supported wallet currency.
          schema:
            type: string
            default: USD
            example: USD
      responses:
        '200':
          description: Current rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      base:
                        type: string
                        example: USD
                      rates:
                        type: object
                        description: One entry per supported wallet currency. `null` means no rate is available right now.
                        additionalProperties:
                          type: number
                          nullable: true
                        example:
                          ARS: 1185.5
                          BRL: 5.4321
                          EUR: 0.9187
                          MXN: 18.6024
                          USD: 1
                      updated_at:
                        type: string
                        format: date-time
                        description: When the rates were last refreshed (UTC).
                        example: '2026-10-01T12:00:00+00:00'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Team member without the Currency Exchange view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: base is not a supported wallet currency. The error lists the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than one request in a minute. The Retry-After header says how many seconds to wait.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Rates are temporarily unavailable. Try again shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fees:
    get:
      tags: [Payments & Transfers]
      summary: Get Fee Schedule
      description: |
        The fees your account is charged for every service it can use. Each line shows the fixed fee,
        the percentage fee and the minimum and maximum charge. Lines with custom pricing for your
        account have `source: custom`; the rest show your plan's default rate (`source: default`).

        Team members need the **Billing & Plans → view** permission.
      responses:
        '200':
          description: Fee schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      plan_id:
                        type: integer
                        example: 2
                      payin:
                        type: array
                        description: Every active payin method. `gateway_id` is the method ID used for deposits and quotes.
                        items:
                          $ref: '#/components/schemas/MethodFeeLine'
                      payout:
                        type: array
                        description: Every active payout method. `gateway_id` is the payout method ID.
                        items:
                          $ref: '#/components/schemas/MethodFeeLine'
                      virtual_account:
                        type: array
                        description: Deposit fees per virtual-account currency. A currency whose fee depends on the network it arrives on has one line per network.
                        items:
                          allOf:
                            - type: object
                              properties:
                                currency:
                                  type: string
                                  example: USD
                                display_currency:
                                  type: string
                                  example: USD
                                network:
                                  type: string
                                  nullable: true
                                  example: ACH
                            - $ref: '#/components/schemas/FeeLine'
                      virtual_card:
                        type: array
                        description: 'Virtual card actions: card_creation, topup, charge_back, card_termination, card_decline.'
                        items:
                          allOf:
                            - type: object
                              properties:
                                action:
                                  type: string
                                  example: card_creation
                            - $ref: '#/components/schemas/FeeLine'
                      employee_card:
                        type: array
                        nullable: true
                        description: Employee card actions. `null` if your business isn't enabled for employee cards. Free actions are left out.
                        items:
                          allOf:
                            - type: object
                              properties:
                                action:
                                  type: string
                                  example: virtual_card_create
                                waive_above:
                                  type: number
                                  nullable: true
                                  description: The fee is waived when the transaction amount is above this value. `null` = never waived.
                            - $ref: '#/components/schemas/FeeLine'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Team member without the Billing & Plans view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sendmoney/quote:
    post:
      tags: [Payments & Transfers]
      summary: Get Send Money Quote
      description: |
        Generates a rate-locked quote for a cross-border payment. The quote guarantees the
        displayed rate and fee for **5 minutes**. Use the returned `quote_id` when executing
        with `POST /sendmoney`. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_currency, to_currency, amount]
              properties:
                from_currency:
                  type: string
                  example: USD
                  description: Source currency code (e.g. `"USD"`, `"EUR"`).
                to_currency:
                  type: string
                  example: MXN
                  description: Destination currency code (e.g. `"CLP"`, `"MXN"`, `"BRL"`).
                amount:
                  type: number
                  example: 200
                  description: Amount in the source currency to send.
      responses:
        '200':
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      quote_id:
                        type: string
                        format: uuid
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      rate:
                        type: string
                      amount:
                        type: string
                      payout_data:
                        type: object

  /sendmoney:
    post:
      tags: [Payments & Transfers]
      summary: Send Money
      description: |
        Execute a cross-border payment using a quote ID obtained from `POST /sendmoney/quote`.
        The quote locks the exchange rate for 5 minutes.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  format: uuid
                  description: The quote ID from `POST /sendmoney/quote`. Valid for 5 minutes.
                debit_wallet:
                  type: string
                  description: Currency to debit from your wallet (e.g. `"USD"`).
                payment_method_id:
                  type: number
                  description: Saved beneficiary payment method ID.
                customer_id:
                  type: string
                  description: The customer the payment method belongs to.
                amount:
                  type: number
                  description: Amount to send. Required if `quote_id` is not provided.
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                      status:
                        type: string
                        example: pending
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      amount:
                        type: string
                      rate:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Quote expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-methods/payout:
    get:
      tags: [Payments & Transfers]
      summary: Get Payout Methods
      description: |
        Returns payout methods (banks, mobile wallets, etc.) available for a given destination country.
        Use the returned `id` as `payment_method_id` when creating payouts or adding beneficiary payment methods.
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
          description: The destination country in ISO 3166-1 alpha-3 format (e.g. `CHL` for Chile, `MEX` for Mexico, `PER` for Peru).
          example: CHL
      responses:
        '200':
          description: List of payout methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        method_name:
                          type: string
                        country:
                          type: string
                        currency:
                          type: string
                        base_currency:
                          type: string

  /payment-methods/payout/countries:
    get:
      tags: [Payments & Transfers]
      summary: Get Supported Payout Countries
      description: Returns all countries where Yativo supports outgoing payments.
      responses:
        '200':
          description: List of supported countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        iso3:
                          type: string
                          example: CHL
                        iso2:
                          type: string
                          example: CL
                        name:
                          type: string
                          example: Chile

  /payment-methods/payin:
    get:
      tags: [Payments & Transfers]
      summary: Get Payin Methods
      description: Returns available payin (deposit) methods for a given country.
      parameters:
        - name: country
          in: query
          schema:
            type: string
          description: Country in ISO 3166-1 alpha-2 or alpha-3.
      responses:
        '200':
          description: List of payin methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      type: object

  /beneficiary/form/show/{payment_method_id}:
    get:
      tags: [Payments & Transfers]
      summary: Get Payout Form Fields
      description: |
        Returns the dynamic form fields required to add a beneficiary payment method or execute a payout.
        Fields vary by country and payment method. Use the `id` from `GET /payment-methods/payout`.
      parameters:
        - name: payment_method_id
          in: path
          required: true
          schema:
            type: integer
          description: The ID of the payment method, obtained from `GET /payment-methods/payout`.
          example: 42
      responses:
        '200':
          description: Form field definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_id:
                    type: integer
                  currency:
                    type: string
                  form_data:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        type:
                          type: string
                        required:
                          type: boolean
                        options:
                          type: array
                          items:
                            type: object
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time

  /wallet/payout:
    post:
      tags: [Payments & Transfers]
      summary: Initiate Payout (Wallet)
      description: |
        Initiate an outgoing payment to a beneficiary from your wallet.
        Use a `quote_id` to lock the exchange rate for 5 minutes.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_wallet, payment_method_id, customer_id]
              properties:
                debit_wallet:
                  type: string
                  description: The wallet currency to debit (e.g. `"USD"`, `"EUR"`).
                  example: USD
                payment_method_id:
                  type: integer
                  description: The customer's saved payout method ID, from `POST /beneficiaries/payment-methods`.
                  example: 555
                customer_id:
                  type: string
                  description: The customer the payout method belongs to.
                  example: da44a3e6-eb5d-429f-8d17-357aa5a6cdf2
                quote_id:
                  type: string
                  format: uuid
                  description: "A payout quote from `POST /exchange-rate` (`method_type: \"payout\"`). Recommended. The quote supplies the amount, so `amount` and `amount_type` are ignored. The quote's `method_id` must be the payout method behind `payment_method_id`."
                amount:
                  type: number
                  description: 'Required if `quote_id` is not provided. With `amount_type: "send"` (the default), the amount to send in the `debit_wallet` currency. With `amount_type: "receive"`, the amount the customer receives in the payout currency.'
                amount_type:
                  type: string
                  enum: [send, receive]
                  default: send
                  description: '`send` or `receive`. Ignored when `quote_id` is provided. In both modes fees are added on top and charged to your wallet.'
                reference:
                  type: string
                  maxLength: 250
                  description: Payment reference passed to the recipient's bank, up to 250 characters. Depending on the payout rail, it may be shortened or have unsupported characters removed. For example, ACH allows only 10 letters, numbers or spaces.
                invoice:
                  type: string
                  format: binary
                  description: 'Supporting invoice: PDF, PNG or JPEG, up to 15 MB. Send the request as `multipart/form-data` to attach it.'
                invoice_url:
                  type: string
                  format: uri
                  description: Public `http` or `https` link to the supporting invoice, as an alternative to `invoice`.
      responses:
        '201':
          description: Payout initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: integer
                        description: Use with GET /transaction/tracking/{id}.
                      payout_id:
                        type: integer
                        description: Use with GET /payout/fetch/{payout_id}.
                      status:
                        type: string
                        example: pending
                      amount_type:
                        type: string
                        enum: [send, receive]
                      send_amount:
                        type: number
                        description: Amount sent, in the debit wallet currency, before fees.
                      customer_receive_amount:
                        type: number
                        description: Amount the customer receives, in currency.
                      debit_amount:
                        type: number
                        description: Total debited from your wallet, fees included.
                      currency:
                        type: string
                        description: The payout currency.
                      fees:
                        type: object
                        description: Full fee and rate breakdown.
                      processed_at:
                        type: string
                        format: date-time
        '400':
          description: Insufficient balance, expired quote, or amount outside the method's limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: amount_type is not send or receive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # DEPOSITS
  # ============================================================

  /wallet/deposits/new:
    post:
      tags: [Deposits]
      summary: Create Deposit (Payin)
      description: |
        Initiate a customer deposit via a supported payin gateway. Optionally pass a `quote_id`
        from `POST /exchange-rate` (with `method_type: "payin"`) to lock the rate.
        After a successful response, redirect the customer to `deposit_url`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway, currency]
              properties:
                gateway:
                  type: integer
                  description: The payin gateway ID. Get valid IDs from `GET /payment-methods/payin?country={iso2}`.
                currency:
                  type: string
                  description: The wallet currency to credit (e.g. `"USD"`, `"BRL"`). Must match one of the gateway's supported base currencies.
                  example: USD
                amount:
                  type: number
                  description: Amount to deposit in the local (payin) currency. Required if `quote_id` is not provided. If `quote_id` is present, the amount is taken from the quote.
                quote_id:
                  type: string
                  format: uuid
                  description: 'A quote ID from `POST /exchange-rate` (created with `method_type: "payin"`). When supplied, the locked amount and rate from the quote are used — `amount` is ignored.'
                redirect_url:
                  type: string
                  format: uri
                  description: URL to redirect the customer to after completing the payment on the gateway's hosted page.
      responses:
        '200':
          description: Deposit initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      gateway:
                        type: integer
                      deposit_currency:
                        type: string
                      amount:
                        type: number
                      receive_amount:
                        type: number
                      currency_to:
                        type: string
                      status:
                        type: string
                      deposit_url:
                        type: string
                        description: Redirect customer here to complete payment.
                      transaction_id:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Expired quote / below minimum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Gateway not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /wallet/deposits:
    get:
      tags: [Deposits]
      summary: List Deposits
      description: Returns a list of all payin deposits for your account, with filtering and pagination.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 'Page number for pagination (default: 1).'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          description: 'Records per page (default: 15).'
        - name: gateway
          in: query
          schema:
            type: string
          description: Filter by payment gateway ID.
        - name: currency
          in: query
          schema:
            type: string
          example: BRL
          description: Filter by currency code, e.g. `"PEN"`, `"BRL"`.
        - name: customer_id
          in: query
          schema:
            type: string
          description: Filter by customer ID.
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Filter by start date (`YYYY-MM-DD`).
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: Filter by end date (`YYYY-MM-DD`).
      responses:
        '200':
          description: Paginated deposit list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        gateway:
                          type: integer
                        deposit_currency:
                          type: string
                        amount:
                          type: number
                        receive_amount:
                          type: number
                        currency_to:
                          type: string
                        status:
                          type: string
                        transaction_id:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  # ============================================================
  # VIRTUAL ACCOUNTS
  # ============================================================

  /business/virtual-account/create:
    post:
      tags: [Virtual Accounts]
      summary: Create Virtual Account
      description: |
        Create a virtual bank account for a customer. The customer must have an approved endorsement for the
        currency, as listed by GET /business/virtual-account/currencies-and-endorsements. Each customer can hold
        one virtual account per currency.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency:
                  type: string
                  description: |-
                    Currency code for the virtual account, for example `USDBASE`, `EURBASE`, `MXN` or `BRL`. `GET /business/virtual-account/currencies-and-endorsements` returns every code your account can use and the endorsement each one needs.
                  example: BRL
                customer_id:
                  type: string
                  format: uuid
                  description: The UUID of the KYC-approved customer. **Required when currency is `USD`**; optional for other currencies.
      responses:
        '201':
          description: Virtual account creation in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualAccount'

  /business/virtual-account:
    get:
      tags: [Virtual Accounts]
      summary: List Virtual Accounts
      description: Returns all virtual accounts for your business with optional filtering.
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          example: BRL
          description: Filter by currency code (e.g. `BRL`, `USD`).
        - name: status
          in: query
          schema:
            type: string
          description: Filter by account status.
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: From date (ISO 8601), e.g. `2026-04-01`.
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: To date (ISO 8601), e.g. `2026-04-30`.
        - name: search
          in: query
          schema:
            type: string
          description: Search by account name or account number.
        - name: per_page
          in: query
          schema:
            type: integer
          description: Results per page.
      responses:
        '200':
          description: List of virtual accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccount'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /business/virtual-account/show/{externalId}:
    get:
      tags: [Virtual Accounts]
      summary: Get Virtual Account
      description: Returns full details for a specific virtual account by its external ID.
      parameters:
        - name: externalId
          in: path
          required: true
          schema:
            type: string
          description: The external ID of the virtual account.
      responses:
        '200':
          description: Virtual account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualAccount'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/virtual-account/delete-virtual-account/{account_id}:
    delete:
      tags: [Virtual Accounts]
      summary: Delete Virtual Account
      description: Permanently deletes a virtual account. This action is irreversible. The account stops accepting funds and a `virtual_account.deleted` webhook is sent.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the virtual account to delete.
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Virtual account deleted successfully
                      account_id:
                        type: string
                        example: acct_xxxxxx
        '400':
          description: The account couldn't be closed. Retry later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  status_code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Request failed.
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Unable to delete virtual account, please try again later
        '404':
          description: The account doesn't exist or isn't yours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  status_code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: Request failed.
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Account with the provided ID does not exists

  /business/virtual-account/history/{accountNumber}:
    get:
      tags: [Virtual Accounts]
      summary: Virtual Account Transaction History
      description: Returns all payments received into a specific virtual account.
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          description: The account number (not the account ID).
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccountHistory'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /business/virtual-account/histories:
    get:
      tags: [Virtual Accounts]
      summary: All Virtual Account Histories
      description: |
        Returns deposit histories across all virtual accounts for your business.
        Consolidated view of all incoming payments.
      responses:
        '200':
          description: All histories
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccountHistory'

  /business/virtual-account/customer/accounts/{customerId}:
    get:
      tags: [Virtual Accounts]
      summary: Customer Virtual Accounts
      description: Returns all virtual accounts associated with a specific customer.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique ID of the customer whose virtual accounts you want to retrieve.
      responses:
        '200':
          description: Customer virtual accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccount'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # WALLETS
  # ============================================================

  /wallet/balance:
    get:
      tags: [Wallets]
      summary: Get Wallet Balance
      description: Returns current balance for all wallets on your account.
      responses:
        '200':
          description: All wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletBalance'

  /wallet/balance/total:
    get:
      tags: [Wallets]
      summary: Get Total Balance (USD)
      description: Returns the sum of all wallet balances converted to USD.
      responses:
        '200':
          description: Total balance in USD
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_balance:
                        type: number
                        example: 37629.18

  /wallet/create:
    post:
      tags: [Wallets]
      summary: Create Wallet
      description: |
        Create a new wallet to hold a specific currency. Once created, it appears in your
        balance list with a zero balance. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency:
                  type: string
                  description: The currency code for the new wallet (e.g. `COP`, `PEN`, `ARS`, `CLP`).
                  example: COP
      responses:
        '201':
          description: Wallet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      currency:
                        type: string
                      balance:
                        type: string
                        example: '0.00'
                      created_at:
                        type: string
                        format: date-time

  /wallet/payouts:
    get:
      tags: [Wallets]
      summary: List Wallet Payouts
      description: Returns a list of payout (withdrawal) transactions made from your wallets.
      responses:
        '200':
          description: List of wallet payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        amount:
                          type: string
                        currency:
                          type: string
                        status:
                          type: string
                        recipient:
                          type: string
                        reference:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  # ============================================================
  # BENEFICIARIES
  # ============================================================

  /beneficiaries/list:
    get:
      tags: [Beneficiaries]
      summary: List Beneficiaries
      description: Returns a paginated list of all beneficiaries in your account.
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
          description: 'Number of records per page (default: 20).'
      responses:
        '200':
          description: Paginated beneficiary list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Beneficiary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /beneficiaries:
    post:
      tags: [Beneficiaries]
      summary: Create Beneficiary
      description: |
        Create a beneficiary record to store recipient information for future payouts.
        After creating, add payment method details via `POST /beneficiaries/payment-methods`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_type, customer_name, customer_email, customer_address, country]
              properties:
                recipient_type:
                  type: string
                  enum: [individual, business]
                  description: 'Beneficiary type: `"individual"` or `"business"`.'
                customer_name:
                  type: string
                  description: Full name of the beneficiary (individual) or legal business name.
                customer_email:
                  type: string
                  format: email
                  description: Beneficiary's email address.
                customer_address:
                  type: string
                  description: Beneficiary's physical address.
                country:
                  type: string
                  description: Beneficiary's country code (e.g. `CHL`, `MEX`, `BRA`).
                customer_nickname:
                  type: string
                  description: A short label for this beneficiary. Defaults to `customer_name` if omitted.
      responses:
        '200':
          description: Beneficiary created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/Beneficiary'

  /beneficiaries/{id}:
    get:
      tags: [Beneficiaries]
      summary: Get Beneficiary
      description: Returns full details for a specific beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary to retrieve.
      responses:
        '200':
          description: Beneficiary details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/Beneficiary'

    put:
      tags: [Beneficiaries]
      summary: Update Beneficiary
      description: |
        Full replacement of a beneficiary's profile. All required fields must be provided.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary to update.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_type, customer_name, customer_email, customer_address, country]
              properties:
                recipient_type:
                  type: string
                  enum: [individual, business]
                  description: 'Beneficiary type: `"individual"` or `"business"`.'
                customer_name:
                  type: string
                  description: Full name of the beneficiary (individual) or legal business name.
                customer_email:
                  type: string
                  format: email
                  description: Beneficiary's email address.
                customer_address:
                  type: string
                  description: Beneficiary's physical address.
                country:
                  type: string
                  description: Beneficiary's country code (e.g. `CHL`, `MEX`, `BRA`).
                customer_nickname:
                  type: string
                  description: A short label for this beneficiary. Defaults to `customer_name` if omitted.
      responses:
        '200':
          description: Beneficiary updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags: [Beneficiaries]
      summary: Delete Beneficiary
      description: Permanently delete a beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary to delete.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /beneficiaries/{id}/archive:
    put:
      tags: [Beneficiaries]
      summary: Archive Beneficiary
      description: Archive a beneficiary to hide them without permanent deletion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary to archive.
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                type: object

  /beneficiaries/{id}/unarchive:
    put:
      tags: [Beneficiaries]
      summary: Unarchive Beneficiary
      description: Restore a previously archived beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary to unarchive.
      responses:
        '200':
          description: Unarchived
          content:
            application/json:
              schema:
                type: object

  /beneficiaries/payment-methods/all:
    get:
      tags: [Beneficiaries]
      summary: List Beneficiaries
      description: Returns every beneficiary saved on your account.
      responses:
        '200':
          description: All payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods:
    post:
      tags: [Beneficiaries]
      summary: Add Beneficiary
      description: |
        Save a recipient's account details (bank account, wallet) as a beneficiary. Use the returned `id` in payouts and quotes.
        The structure of `payment_data` varies by payment method — retrieve required fields
        from `GET /beneficiary/form/show/{payment_method_id}`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id, payment_data, currency, nickname]
              properties:
                gateway_id:
                  type: integer
                  description: The ID of the payout method (gateway) to use. Obtain available IDs from the payout methods endpoint.
                payment_data:
                  type: object
                  description: Key/value pairs of account details required for this payment method. The fields vary depending on the selected `gateway_id`.
                  additionalProperties: true
                currency:
                  type: string
                  example: CLP
                  description: Currency code for this payment method (e.g. `CLP`, `MXN`, `BRL`).
                nickname:
                  type: string
                  description: A label to identify this payment method.
      responses:
        '200':
          description: Payment method added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods/{id}:
    post:
      tags: [Beneficiaries]
      summary: Get Beneficiary
      description: Retrieve one saved beneficiary by its `id`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Payment method details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods/update/{id}:
    put:
      tags: [Beneficiaries]
      summary: Update Beneficiary
      description: |
        Full replacement of a saved beneficiary. All required fields must be provided.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary payment method to update.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id, currency, payment_data, nickname]
              properties:
                gateway_id:
                  type: integer
                  description: The ID of the payout method (gateway).
                currency:
                  type: string
                  description: Currency code for this payment method (e.g. `CLP`, `MXN`, `BRL`).
                payment_data:
                  type: object
                  additionalProperties: true
                  description: Updated key/value pairs of account details. Must include all fields required by the selected gateway.
                nickname:
                  type: string
                  description: A label to identify this payment method.
      responses:
        '200':
          description: Payment method updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods/delete/{id}:
    delete:
      tags: [Beneficiaries]
      summary: Delete Beneficiary
      description: Permanently delete a saved beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the beneficiary payment method to delete.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ============================================================
  # TRANSACTIONS
  # ============================================================

  /business/transactions/index:
    get:
      tags: [Transactions]
      summary: List Transactions
      description: |
        Returns all transactions (deposits, payouts, virtual account receipts, card transactions)
        for your account with filtering and pagination.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [success, complete, detected, pending, 'In Progress', failed]
          description: 'Filter by status: `success`, `complete`, `detected`, `pending`, `In Progress`, `failed`.'
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: From date (inclusive), e.g. `2026-04-01`.
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: To date (inclusive), e.g. `2026-04-30`.
        - name: amount
          in: query
          schema:
            type: number
          description: Filter by exact transaction amount.
        - name: customer_id
          in: query
          schema:
            type: string
          description: Filter by customer ID.
        - name: transaction_type
          in: query
          schema:
            type: string
            enum: [deposit, payout, virtual_account, transfer, card_transaction, crypto_deposit]
          description: 'Filter by type: `deposit`, `payout`, `virtual_account`, `transfer`, `card_transaction`, `crypto_deposit`.'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: 'Page number. Default: `1`.'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
          description: 'Results per page. Default: `10`.'
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/Pagination'

  /business/transaction/show/{id}:
    get:
      tags: [Transactions]
      summary: Get Transaction
      description: Returns complete details for a single transaction by its internal numeric ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The internal numeric transaction ID (the `id` field, not the `transaction_id` UUID).
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Transaction'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transaction/tracking/{quote_id}:
    get:
      tags: [Transactions]
      summary: Track Transaction
      description: Returns a step-by-step timeline of a transaction's progress.
      parameters:
        - name: quote_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The `quote_id` associated with the transaction. This is the quote ID returned when the transaction or quote was created — not a generic transaction ID.
      responses:
        '200':
          description: Transaction timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tracking_status:
                          type: string
                        transaction_type:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  /transaction/track:
    get:
      tags: [Transactions]
      summary: Track Transaction by ID
      description: |
        Look up a transaction by its transaction ID and type. Returns a direct lookup by the
        transaction's own ID (distinct from the timeline tracking endpoint).
      parameters:
        - name: txn_id
          in: query
          required: true
          schema:
            type: string
          description: The transaction ID to look up.
        - name: txn_type
          in: query
          required: true
          schema:
            type: string
            enum: [payout, payin, swap]
          description: 'The type of the transaction. Common values: `"payout"`, `"payin"`, `"swap"`.'
      responses:
        '200':
          description: Transaction record
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      transaction_id:
                        type: string
                      type:
                        type: string
                      amount:
                        type: string
                      currency:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/transaction/{transactionId}/{type}/receipt:
    get:
      tags: [Transactions]
      summary: Download Receipt
      description: |
        Returns a receipt for a completed transaction. Pass `pdf` as `type` to receive a
        base64-encoded PDF, or use `json` for structured data.
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the transaction.
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [pdf, json]
          description: Receipt format. Use `"pdf"` to receive a base64-encoded PDF document.
      responses:
        '200':
          description: Receipt (base64 PDF when type=pdf)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: string
                    description: Base64-encoded PDF when type is pdf.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # VIRTUAL CARDS
  # ============================================================

  /customer/virtual/cards/activate:
    post:
      tags: [Virtual Cards]
      summary: Activate Customer for Virtual Cards
      description: |
        Registers a customer for virtual card creation. Required before issuing any virtual cards.
        Fields already stored on the customer's profile may be omitted.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The ID of the customer to activate. Must exist in your customers table.
                user_photo:
                  type: string
                  description: Customer photo (base64 or URL). Required if not already on the customer's profile.
                idType:
                  type: string
                  enum: [passport, drivers_license, national_id]
                  description: Government ID type (e.g. `"passport"`, `"drivers_license"`, `"national_id"`). Required for Nigerian customers.
                customer_idFront:
                  type: string
                  description: Front image of the customer's government-issued ID. Required if not already on the customer's profile.
                customer_idNumber:
                  type: string
                  description: Government-issued ID number. Required if not already on the customer's profile.
                customer_address:
                  type: object
                  properties:
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2.
                    city:
                      type: string
                    state:
                      type: string
                    zipcode:
                      type: string
                    street:
                      type: string
                    number:
                      type: string
                    customer_address.country:
                      type: string
                      description: ISO 3166-1 alpha-2 country code (e.g. `"US"`).
                    customer_address.city:
                      type: string
                      description: City name.
                    customer_address.state:
                      type: string
                      description: State or region.
                    customer_address.zipcode:
                      type: string
                      description: Postal / ZIP code.
                    customer_address.street:
                      type: string
                      description: Street name.
                    customer_address.number:
                      type: string
                      description: Street number.
                  description: Customer address. Each sub-field is required if not already on the customer's profile.
      responses:
        '200':
          description: Customer registered for virtual cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: User registered successfully.

  /customer/virtual/cards/create:
    post:
      tags: [Virtual Cards]
      summary: Create Virtual Card
      description: |
        Issues a virtual card for an activated customer. The initial funding amount is debited
        from your USD wallet. Minimum $3.00, maximum $10,000.00.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, amount]
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: The ID of the activated customer. Must exist in your customers table.
                amount:
                  type: number
                  minimum: 3
                  maximum: 10000
                  description: Initial funding amount in USD. Minimum $3.00, maximum $10,000.00.
      responses:
        '201':
          description: Virtual card created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualCard'

  /customer/virtual/cards/list:
    get:
      tags: [Virtual Cards]
      summary: List Virtual Cards
      description: Returns all virtual cards issued under your business account.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          description: Page number.
        - name: per_page
          in: query
          schema:
            type: integer
          description: Results per page.
      responses:
        '200':
          description: List of virtual cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualCard'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /customer/virtual/cards/get/{card_id}:
    get:
      tags: [Virtual Cards]
      summary: Get Virtual Card
      description: Returns full details for a specific virtual card.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
          description: The virtual card ID.
      responses:
        '200':
          description: Virtual card details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualCard'
        '404':
          description: Card not found. The card doesn't exist or isn't one of yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer/virtual/cards/topup:
    post:
      tags: [Virtual Cards]
      summary: Top Up Card
      description: |
        Adds funds to a virtual card. Amount is always debited from your USD wallet.
        Minimum $1.00, maximum $10,000.00.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                cardId:
                  type: string
                  description: The virtual card ID to fund. Either `cardId` or `card_id` must be provided.
                card_id:
                  type: string
                  description: The virtual card ID to fund. Either `cardId` or `card_id` must be provided.
                amount:
                  type: number
                  minimum: 1
                  maximum: 10000
                  description: Amount to add to the card. Minimum 1.00, maximum 10,000.00 (USD).
      responses:
        '200':
          description: Card topped up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                      amount_added:
                        type: string
                      new_balance:
                        type: string
                      currency:
                        type: string
        '404':
          description: Card not found. The card doesn't exist or isn't one of yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer/virtual/cards/update/{card_id}:
    put:
      tags: [Virtual Cards]
      summary: Freeze / Unfreeze Card
      description: |
        Freeze or unfreeze a virtual card. A frozen card declines all transactions until unfrozen.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
          description: The virtual card ID.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [freeze, unfreeze]
                  description: '`"freeze"` to block the card, or `"unfreeze"` to re-enable it.'
      responses:
        '200':
          description: Card status updated
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Card not found. The card doesn't exist or isn't one of yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer/virtual/cards/transactions/{card_id}:
    get:
      tags: [Virtual Cards]
      summary: Card Transactions
      description: Returns all transactions made with a specific virtual card.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
          description: The virtual card ID.
      responses:
        '200':
          description: Card transaction history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transaction_id:
                          type: string
                        amount:
                          type: string
                        currency:
                          type: string
                        merchant_name:
                          type: string
                        merchant_category:
                          type: string
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        '404':
          description: Card not found. The card doesn't exist or isn't one of yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer/virtual/cards/withdraw:
    post:
      tags: [Virtual Cards]
      summary: Withdraw from Card
      description: |
        Moves funds from a virtual card back to your USD wallet balance.
        Minimum $1.00.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, amount]
              properties:
                cardId:
                  type: string
                  description: The virtual card ID to withdraw from.
                amount:
                  type: number
                  minimum: 1
                  description: Amount to withdraw from the card. Minimum 1.00.
      responses:
        '200':
          description: Withdrawal successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                      amount_withdrawn:
                        type: string
                      new_card_balance:
                        type: string
                      currency:
                        type: string
        '404':
          description: Card not found. The card doesn't exist or isn't one of yours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customer/virtual/cards/terminate:
    post:
      tags: [Virtual Cards]
      summary: Terminate Card
      description: |
        Permanently terminates a virtual card. This action is irreversible.
        Withdraw any remaining balance before terminating.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId]
              properties:
                cardId:
                  type: string
                  description: The virtual card ID to terminate.
      responses:
        '200':
          description: Card terminated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                      status:
                        type: string
                        example: terminated

  # ============================================================
  # PAYOUTS
  # ============================================================

  /payout/simple:
    post:
      tags: [Payouts]
      summary: Single Payout
      description: |
        Send a single payment to a saved beneficiary. Debits your wallet immediately on submission.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_wallet, amount, beneficiary_details_id, customer_id]
              properties:
                debit_wallet:
                  type: string
                  description: The source wallet currency to debit (e.g. `"USD"`, `"EUR"`).
                  example: USD
                amount:
                  type: number
                  description: Amount to send in the debit wallet currency.
                  example: 250
                beneficiary_details_id:
                  type: integer
                  description: The saved beneficiary payment method ID (from `POST /beneficiaries/payment-methods`).
                customer_id:
                  type: string
                  description: The customer the payout is for. If the beneficiary belongs to a customer, it must be that customer.
                  example: da44a3e6-eb5d-429f-8d17-357aa5a6cdf2
                beneficiary_id:
                  type: string
                  description: Optional. The beneficiary that owns the payment method.
                quote_id:
                  type: string
                  format: uuid
                  description: A payout quote from `POST /exchange-rate`. Locks the rate and fees for 5 minutes and supplies the amount.
                reference:
                  type: string
                  maxLength: 250
                  description: Payment reference passed to the recipient's bank, up to 250 characters. Depending on the payout rail, it may be shortened or have unsupported characters removed. For example, ACH allows only 10 letters, numbers or spaces.
                invoice:
                  type: string
                  format: binary
                  description: 'Supporting invoice: PDF, PNG or JPEG, up to 15 MB. Send the request as `multipart/form-data` to attach it.'
                invoice_url:
                  type: string
                  format: uri
                  description: Public `http` or `https` link to the supporting invoice, as an alternative to `invoice`.
      responses:
        '200':
          description: Payout initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                      status:
                        type: string
                      amount:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Insufficient wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payout/get:
    get:
      tags: [Payouts]
      summary: List Payouts
      description: Returns a paginated list of all payouts.
      responses:
        '200':
          description: Paginated payout list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutRecord'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /payout/fetch/{payout_id}:
    get:
      tags: [Payouts]
      summary: Get Payout
      description: Returns details for a specific payout by ID.
      parameters:
        - name: payout_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the payout to retrieve.
      responses:
        '200':
          description: Payout details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PayoutRecord'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # CURRENCY SWAP
  # ============================================================

  /wallet/swap/pairs:
    get:
      tags: [Currency Swap]
      summary: List Swap Pairs
      description: |
        Every currency pair you can swap between your own wallets, with its current rate, fees and amount limits.

        Team members need the **Wallets → view** permission.
      responses:
        '200':
          description: Swap pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletSwapPair'

  /wallet/swap/quote:
    post:
      tags: [Currency Swap]
      summary: Quote Swap
      description: |
        Price a swap without moving money. The fee is charged in `from_currency` and deducted before conversion:
        `to_amount = (amount − fee) × rate`, rounded down to the destination currency's decimal places.

        A quote doesn't reserve the rate or your balance.

        Team members need the **Wallets → view** permission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletSwapRequest'
      responses:
        '200':
          description: Swap quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      from_currency:
                        type: string
                        example: USD
                      to_currency:
                        type: string
                        example: USDC
                      from_amount:
                        type: number
                        description: Amount debited from the source wallet, including the fee.
                        example: 1000
                      fee:
                        type: number
                        description: Fee in `from_currency`.
                        example: 5
                      net_amount:
                        type: number
                        description: "`from_amount` minus `fee`. The amount converted."
                        example: 995
                      rate:
                        type: number
                        example: 1
                      to_amount:
                        type: number
                        description: Amount credited to the destination wallet.
                        example: 995
                      available_balance:
                        type: number
                        description: Your current balance in the source wallet.
                        example: 2500
        '422':
          description: Validation error, pair not available, amount outside the pair's limits, or no source wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet/swap:
    get:
      tags: [Currency Swap]
      summary: List Swaps
      description: |
        Your swaps, newest first, 10 per page by default.

        Team members need the **Wallets → view** permission.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Paginated swaps
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WalletSwap'
                      per_page:
                        type: integer
                        example: 10
                      last_page:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 1
    post:
      tags: [Currency Swap]
      summary: Run Swap
      description: |
        Debit the source wallet and credit the destination wallet in one step. If the credit fails, the debit is reversed.
        If you don't have a wallet in `to_currency`, it's created.

        Retrying with the same `Idempotency-Key` returns the original swap and doesn't swap again.

        Your USDC wallet can only be credited from USD, and can't be swapped out of. Those swaps fail with `Invalid wallet selected.`

        Team members need the **Wallets → manage** permission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletSwapRequest'
      responses:
        '200':
          description: Swap completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/WalletSwap'
        '422':
          description: Validation error, pair not available, amount outside the pair's limits, insufficient balance, or invalid wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet/swap/{reference}:
    get:
      tags: [Currency Swap]
      summary: Get Swap
      description: |
        A single swap by the `reference` returned when you ran it.

        Team members need the **Wallets → view** permission.
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            example: 9b1f0c52-3a8e-4f4e-b2a1-6f0e5d7c8a91
      responses:
        '200':
          description: Swap
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/WalletSwap'
        '404':
          description: Swap not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # WEBHOOKS
  # ============================================================

  /business/webhook:
    get:
      tags: [Webhooks]
      summary: List Webhooks
      description: Returns all configured webhook endpoints for your business account.
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookRecord'

    post:
      tags: [Webhooks]
      summary: Create Webhook
      description: |
        Register a URL to receive webhook notifications. Yativo signs every request with an
        `Signature` header (HMAC-SHA256 of raw body using your webhook secret).

        **Supported events:** `deposit.created`, `deposit.updated`, `deposit.completed`,
        `payout.updated`, `payout.completed`, `customer.created`, `customer.kyc.approved`,
        `customer.kyc.rejected`, `virtual_account.deposit`, `virtual_account.funded`.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: The HTTPS URL of your webhook endpoint. Must be publicly accessible.
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                      secret:
                        type: string
                        description: Store securely. Used to verify the Signature header.
                      created_at:
                        type: string
                        format: date-time

  /business/webhook/{webhook_id}:
    put:
      tags: [Webhooks]
      summary: Update Webhook
      description: Update an existing webhook endpoint URL.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                type: object

    delete:
      tags: [Webhooks]
      summary: Delete Webhook
      description: |
        Delete a webhook endpoint. Yativo stops delivering events to this URL immediately.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the webhook to delete. Returned when the webhook was created.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/webhook/{webhook_id}/regenerate-secret:
    post:
      tags: [Webhooks]
      summary: Regenerate Webhook Secret
      description: |
        Issue a new HMAC signing secret for an existing webhook. The old secret is invalidated
        immediately — update `YATIVO_WEBHOOK_SECRET` in your environment right away.
        The new secret is shown only once.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the webhook whose secret you want to regenerate.
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New secret issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      webhook_id:
                        type: string
                      secret:
                        type: string
                        description: New HMAC secret. Shown once only.
                      updated_at:
                        type: string
                        format: date-time

  # ============================================================
  # IP WHITELIST
  # ============================================================

  /ip-whitelist/check:
    get:
      tags: [IP Whitelist]
      summary: Check IP Whitelist
      description: |
        Shows the IP Yativo sees for your request and whether it can use your API key.
        Never blocks the request. Call it from the server that uses the key. Limited to 30 requests a minute.
      parameters:
        - name: ip
          in: query
          required: false
          description: Check this IP against your whitelist instead of the detected one. `key_usage` still describes the calling server.
          schema:
            type: string
            example: 198.51.100.7
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      key_usage:
                        type: object
                        properties:
                          authenticated_with_api_key:
                            type: boolean
                          key:
                            type: string
                            example: yativo_pk_9f1c2a...
                          request_ip:
                            type: string
                            example: 203.0.113.10
                          allowed_server:
                            type: boolean
                            nullable: true
                            description: Whether the calling server can use this key. `null` when not called with an API key.
                          matched_entry:
                            type: string
                            nullable: true
                            example: 203.0.113.10
                          message:
                            type: string
                      result:
                        type: string
                        enum: [pass, fail]
                      summary:
                        type: string
                        example: 203.0.113.10 passes the IP whitelist.
                      tested_ip:
                        type: string
                        example: 203.0.113.10
                      tested_ip_source:
                        type: string
                        enum: [detected, query]
                      network:
                        type: object
                        properties:
                          detected_ip:
                            type: string
                            example: 203.0.113.10
                          warning:
                            type: string
                            nullable: true
                            description: Set when your request reached Yativo through a proxy, so `detected_ip` may be the proxy's IP. Contact support if `detected_ip` isn't your server's public IP.
                      api_key:
                        type: object
                        nullable: true
                        description: How `tested_ip` compares with this key's whitelist. `null` when not called with an API key.
                        properties:
                          key:
                            type: string
                            example: yativo_pk_9f1c2a...
                          label:
                            type: string
                            example: Production backend
                          key_allowed_ips:
                            type: array
                            items:
                              type: string
                            description: IPs listed on this key.
                          account_whitelisted_ips:
                            type: array
                            items:
                              type: string
                            description: IPs from **Profile → Whitelist** that also apply to this key.
                          matched_entry:
                            type: string
                            nullable: true
                          would_allow:
                            type: boolean
                          would_return:
                            type: object
                            nullable: true
                            description: The error a request from `tested_ip` would get. `null` when allowed.
                            properties:
                              http_status:
                                type: integer
                                example: 403
                              error:
                                type: string
                                example: This IP address is not allowed to use this API key.
                      sitewide:
                        type: object
                        description: How `tested_ip` compares with your account IP whitelist.
                        properties:
                          account_whitelisted_ips:
                            type: array
                            items:
                              type: string
                          matches_own_account_ip:
                            type: boolean
                          would_allow:
                            type: boolean
                          would_return:
                            type: object
                            nullable: true
                            properties:
                              http_status:
                                type: integer
                              error:
                                type: string
        '401':
          description: Missing or invalid API credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The `ip` query parameter isn't a valid IP address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/events/all:
    get:
      tags: [Developer]
      summary: List Webhook Events
      description: Returns a log of all events sent to your configured webhook endpoint.
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
          description: Results per page.
      responses:
        '200':
          description: Webhook event log
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        event_type:
                          type: string
                        status:
                          type: string
                        webhook_url:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /business/events/show/{id}:
    get:
      tags: [Developer]
      summary: Get Webhook Event
      description: Returns complete details and payload for a specific webhook event.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The event ID.
      responses:
        '200':
          description: Event details with payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      event_type:
                        type: string
                      status:
                        type: string
                      webhook_url:
                        type: string
                      payload:
                        type: object
                        description: The event payload delivered to your endpoint, shown with the fields events carry today.
                      delivered_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
        '404':
          description: The event ID isn't in your delivery log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: failed
                  status_code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: Request failed.
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Webhook event not found

  # ── Corporate Card Links ────────────────────────────────────────────────────
  /corporate-card/employees/cards/{card_id}/link:
    get:
      tags: [Corporate Card Links]
      summary: Get Card Link
      description: |
        The card's reusable link, created on the first request. Card number, expiry, CVV and PIN are
        only available on this page, and only the card's employee can open it: an email code the
        first time, then their passkey or authenticator app. Share the URL or embed it in an iframe.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
          description: The card's `card_id`.
        - name: theme_id
          in: query
          required: false
          schema:
            type: string
          description: One of your themes. Adds `?theme=` to the URL so the page and its emails use it.
      responses:
        '200':
          description: Card link
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/CardLink'
        '404':
          description: The card or theme isn't yours, or the card has no employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /corporate-card/employees/cards/{card_id}/link/rotate:
    post:
      tags: [Corporate Card Links]
      summary: Replace Card Link
      description: |
        Replaces the card's link. The old URL stops working straight away, including anywhere it's
        embedded. The employee keeps their passkey or authenticator app.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
          description: The card's `card_id`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                theme_id:
                  type: string
                  description: Optional theme for the returned URL.
      responses:
        '200':
          description: The new card link
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/CardLink'
        '404':
          description: The card or theme isn't yours, or the card has no employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

