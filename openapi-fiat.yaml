openapi: 3.0.3
info:
  title: Yativo Fiat API
  description: |
    The Yativo Fiat API enables businesses to manage customers, run KYC/KYB, send and receive
    cross-border payments, issue virtual accounts and virtual cards, manage beneficiaries, and more.

    **Base URLs**
    | Environment | URL |
    |---|---|
    | Production | `https://api.yativo.com/api/v1` |
    | Sandbox | `https://smtp.yativo.com/api/v1` |

    **Authentication**
    Send `X-Api-Key` and `X-Api-Secret` on every request. Create keys in the dashboard under
    **Developers → API Keys**. Each key only works from the server IPs listed on it (enforced since
    14 October 2026). Keys don't expire and there's no login call or token refresh.

    Login tokens (`POST /auth/login` with an Account ID and App Secret, and `Authorization: Bearer`)
    have been discontinued and don't work for API requests.

    Endpoints that change how a person signs in (passkeys, two-factor authentication, PIN)
    or delete the account can't be called with an API key. Use the dashboard for those.
    API keys and IP whitelists can only be managed in the dashboard.

    **Rate limits**
    Per business account: 20 writes (`POST`, `PUT`, `PATCH`, `DELETE`) and 50 reads (`GET`) a second.
    Some plans set their own limit. Enterprise plans have no general limit.

    **Idempotency**
    Send an `Idempotency-Key` header on every `POST`, `PUT`, `PATCH` and `DELETE` request. A retry with
    the same key and body within 60 minutes returns the original response without running again.
    Reusing a key with a different body returns `409`.

    **KYC endpoints** are hosted on a separate platform at `https://kyc.yativo.com`. They are
    documented here for completeness but use that base URL, not the main API base.
  version: 1.0.0
  contact:
    name: Yativo Support
    url: https://yativo.com

servers:
  - url: https://api.yativo.com/api/v1
    description: Production
  - url: https://smtp.yativo.com/api/v1
    description: Sandbox

security:
  - apiKey: []
    apiSecret: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Your API key (`yativo_pk_...`) from Developers → API Keys. Send together with X-Api-Secret.
    apiSecret:
      type: apiKey
      in: header
      name: X-Api-Secret
      description: Your API secret (`yativo_sk_...`), shown once when the key is created.


  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: A unique string per request to ensure idempotent processing.

  schemas:
    WalletSwapRequest:
      type: object
      required: [from_currency, to_currency, amount]
      properties:
        from_currency:
          type: string
          description: Currency of the wallet to debit.
          example: USD
        to_currency:
          type: string
          description: Currency of the wallet to credit. Must differ from `from_currency`.
          example: USDC
        amount:
          type: number
          description: Amount to swap in `from_currency`, including the fee. Must be greater than 0.
          example: 1000
        idempotency_key:
          type: string
          maxLength: 100
          description: "`POST /wallet/swap` only. Alternative to the `Idempotency-Key` header."

    WalletSwapPair:
      type: object
      properties:
        from_currency:
          type: string
          example: USD
        to_currency:
          type: string
          example: USDC
        rate:
          type: number
          description: Units of `to_currency` per unit of `from_currency`, applied after the fee is deducted.
          example: 1
        fixed_fee:
          type: number
          description: Flat fee in `from_currency`.
          example: 0
        percent_fee:
          type: number
          description: Percentage of the amount, charged in `from_currency`.
          example: 0.5
        min_fee:
          type: number
          nullable: true
          example: 1
        max_fee:
          type: number
          nullable: true
          example: null
        min_amount:
          type: number
          nullable: true
          example: 10
        max_amount:
          type: number
          nullable: true
          example: 50000

    WalletSwap:
      type: object
      properties:
        reference:
          type: string
          example: 9b1f0c52-3a8e-4f4e-b2a1-6f0e5d7c8a91
        from_currency:
          type: string
          example: USD
        to_currency:
          type: string
          example: USDC
        from_amount:
          type: number
          example: 1000
        fee:
          type: number
          example: 5
        rate:
          type: number
          example: 1
        to_amount:
          type: number
          example: 995
        status:
          type: string
          example: completed
        created_at:
          type: string
          format: date-time
          example: '2026-10-20T10:15:00+00:00'

    FeeLine:
      type: object
      properties:
        fixed_fee:
          type: number
          description: Flat fee per transaction or action, in fee_currency.
          example: 0.5
        float_fee:
          type: number
          description: Percentage of the transaction amount (1.2 = 1.2%).
          example: 1.2
        min_charge:
          type: number
          nullable: true
          description: Lowest fee charged. null = no minimum.
          example: 1
        max_charge:
          type: number
          nullable: true
          description: Highest fee charged. null = no maximum.
          example: 50
        fee_currency:
          type: string
          example: USD
        source:
          type: string
          enum: [custom, default]
          description: custom = pricing agreed for your account. default = your plan's standard rate.
    MethodFeeLine:
      allOf:
        - type: object
          properties:
            gateway_id:
              oneOf:
                - type: integer
                - type: string
              description: The payin or payout method ID.
            method_name:
              type: string
              example: SPEI
            country:
              type: string
              example: MEX
            currency:
              type: string
              example: MXN
        - $ref: '#/components/schemas/FeeLine'
    CardLink:
      type: object
      properties:
        card_id:
          type: string
          example: 9b1d3c52-0f0e-4a8e-b0b1-6f7a1c2d3e4f
        url:
          type: string
          description: The card link. Stays the same until you replace it.
          example: https://checkout.yativo.com/card-access/cl_Vq3eX9...
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: string
          format: date-time
          nullable: true
    CardAccess:
      type: object
      properties:
        employee_id:
          type: string
          example: emp_456
        email_verified:
          type: boolean
          description: The employee has confirmed their email on a card link.
        enrolled:
          type: boolean
          description: The employee has set up a passkey or authenticator app.
        methods:
          type: array
          items:
            type: string
            enum: [passkey, totp]
        locked:
          type: boolean
          description: Too many wrong attempts. Unlocks at `locked_until` or on reset.
        locked_until:
          type: string
          format: date-time
          nullable: true
        pending_email:
          type: string
          nullable: true
          description: A new email waiting for the employee to confirm on their card link.
        reset_at:
          type: string
          format: date-time
          nullable: true
    CardLinkThemeInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: Acme
        is_default:
          type: boolean
          description: Use for every link that doesn't name another theme. Clears the flag on your other themes.
        logo_url:
          type: string
          nullable: true
          description: https URL, shown 32px tall.
          example: https://cdn.acme.com/logo.png
        font_family:
          type: string
          nullable: true
          maxLength: 64
          description: A Google Fonts family. Letters, numbers, spaces and hyphens.
          example: Inter
        radius:
          type: integer
          nullable: true
          minimum: 0
          maximum: 24
          example: 10
        colors:
          type: object
          description: Any of these keys as `#RRGGBB`. Missing colours use Yativo's defaults.
          properties:
            primary: { type: string, example: '#0A7C4B' }
            primary_text: { type: string, example: '#FFFFFF' }
            background: { type: string, example: '#F6F8F7' }
            surface: { type: string, example: '#FFFFFF' }
            text: { type: string, example: '#10231A' }
            muted: { type: string, example: '#5B6B63' }
            border: { type: string, example: '#DDE5E0' }
            error: { type: string, example: '#C62828' }
        email:
          type: object
          properties:
            sender_name:
              type: string
              nullable: true
              maxLength: 100
              example: Acme Cards
            reply_to:
              type: string
              format: email
              nullable: true
              example: cards@acme.com
            subject:
              type: string
              nullable: true
              maxLength: 150
              example: Your Acme card code
            intro:
              type: string
              nullable: true
              maxLength: 1000
            footer:
              type: string
              nullable: true
              maxLength: 1000
    CardLinkTheme:
      allOf:
        - type: object
          properties:
            theme_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        - $ref: '#/components/schemas/CardLinkThemeInput'
    # ── Generic wrappers ──────────────────────────────────────────────────────
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          example: success
        status_code:
          type: integer
          example: 200
        message:
          type: string

    ErrorDetails:
      type: object
      description: Included on every failed response, with the same shape for every endpoint.
      properties:
        code:
          type: string
          enum: [bad_request, unauthenticated, payment_required, forbidden, not_found, method_not_allowed, conflict, validation_error, rate_limited, server_error, not_implemented, upstream_error, service_unavailable, upstream_timeout]
          example: validation_error
        message:
          type: string
          example: The amount field is required.
        http_status:
          type: integer
          example: 422
        fields:
          type: object
          description: Messages per field. When the error isn't about a field, the message is under `error`.
          additionalProperties:
            type: array
            items:
              type: string
        retryable:
          type: boolean
          description: "`true` for 409, 429, 500, 502, 503 and 504."
          example: false
        retry_after:
          type: integer
          nullable: true
          description: Seconds to wait before retrying, from the `Retry-After` header.

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: failed
        status_code:
          type: integer
        message:
          type: string
          example: Request failed.
        data:
          type: object
          nullable: true
          properties:
            error:
              type: string
        error_details:
          $ref: '#/components/schemas/ErrorDetails'

    ValidationError:
      type: object
      properties:
        status:
          type: string
          example: failed
        status_code:
          type: integer
          example: 422
        message:
          type: string
          example: Request failed.
        data:
          type: object
          description: The failing fields and their messages.
          additionalProperties:
            type: array
            items:
              type: string
        error_details:
          $ref: '#/components/schemas/ErrorDetails'

    Pagination:
      type: object
      properties:
        total:
          type: integer
        per_page:
          type: integer
        current_page:
          type: integer
        last_page:
          type: integer
        next_page_url:
          type: string
          nullable: true
        prev_page_url:
          type: string
          nullable: true

    # ── Auth ──────────────────────────────────────────────────────────────────
    # ── Customer ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        customer_phone:
          type: string
        customer_country:
          type: string
          description: ISO 3166-1 alpha-3 (e.g. USA, BRA, MEX)
        customer_type:
          type: string
          enum: [individual, business]
        customer_status:
          type: string
          example: active
        customer_kyc_status:
          type: string
          example: approved
        kyc_verified_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerAddress:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string

    # ── KYC ───────────────────────────────────────────────────────────────────
    ResidentialAddress:
      type: object
      required: [street_line_1, city, state, postal_code, country, proof_of_address_file]
      properties:
        street_line_1:
          type: string
          maxLength: 256
        street_line_2:
          type: string
        city:
          type: string
          maxLength: 256
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2
        proof_of_address_file:
          type: string
          description: Hosted URL, base64 data URI or multipart file. PDF/JPG/JPEG/PNG/HEIC/TIF, 5 KB–30 MB.

    IdentifyingInformationItem:
      type: object
      required: [type, issuing_country, number, date_issued, expiration_date, image_front_file]
      properties:
        type:
          type: string
          example: passport
        issuing_country:
          type: string
          description: ISO 3166-1 alpha-2
        number:
          type: string
        date_issued:
          type: string
          format: date
        expiration_date:
          type: string
          format: date
        image_front_file:
          type: string
        image_back_file:
          type: string

    KybAddress:
      type: object
      required: [street_line_1, city, state, postal_code, country, proof_of_address_file]
      properties:
        street_line_1:
          type: string
          maxLength: 255
        street_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          description: Subdivision code, e.g. FL.
        postal_code:
          type: string
          description: Must match the country's format.
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        proof_of_address_file:
          type: string
          description: Hosted URL, base64 data URI or multipart file.

    KycValidationError:
      type: object
      description: Validation errors from the KYC platform.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error.
        validation_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        field_labels:
          type: object
          description: A readable name for each failing field.
          additionalProperties:
            type: string
        field_hints:
          type: object
          description: Advice for fixing a field, where available.

    UploadedDocumentItem:
      type: object
      required: [type, file]
      properties:
        type:
          type: string
          example: bank_statement
        file:
          type: string

    # ── Beneficiary ───────────────────────────────────────────────────────────
    Beneficiary:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        recipient_type:
          type: string
          enum: [individual, business]
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        customer_nickname:
          type: string
        country:
          type: string
        customer_address:
          type: string
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BeneficiaryPaymentMethod:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        gateway_id:
          type: integer
        currency:
          type: string
        nickname:
          type: string
        payment_data:
          type: object
          additionalProperties: true
        beneficiary_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Virtual Account ───────────────────────────────────────────────────────
    VirtualAccount:
      type: object
      properties:
        account_id:
          type: string
        account_number:
          type: string
        account_type:
          type: string
        currency:
          type: string
        customer_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    VirtualAccountHistory:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        credited_amount:
          type: number
        transaction_id:
          type: string
        sender_name:
          type: string
        account_number:
          type: string
        transaction_fees:
          type: number
        created_at:
          type: string
          format: date-time

    # ── Wallet ────────────────────────────────────────────────────────────────
    WalletBalance:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        balance:
          type: string
        currency:
          type: string
        decimal_places:
          type: integer
        meta:
          type: object
          properties:
            logo:
              type: string
            symbol:
              type: string
            fullname:
              type: string
            precision:
              type: integer

    # ── Transaction ───────────────────────────────────────────────────────────
    Transaction:
      type: object
      properties:
        id:
          type: integer
        transaction_id:
          type: string
        transaction_amount:
          type: string
        transaction_status:
          type: string
        transaction_type:
          type: string
        transaction_memo:
          type: string
        transaction_purpose:
          type: string
        transaction_currency:
          type: string
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Virtual Card ─────────────────────────────────────────────────────────
    VirtualCard:
      type: object
      properties:
        card_id:
          type: string
        card_number:
          type: string
        expiry:
          type: string
        cvv:
          type: string
        currency:
          type: string
        balance:
          type: string
        status:
          type: string
        customer_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Payout ────────────────────────────────────────────────────────────────
    PayoutRecord:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
        beneficiary_id:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── Webhook ───────────────────────────────────────────────────────────────
    WebhookRecord:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: string
        created_at:
          type: string
          format: date-time

paths:

  /auth/occupation-codes:
    get:
      tags: [KYC / KYB]
      summary: Get Occupation Codes
      description: |
        Returns all valid occupation codes for use in the `most_recent_occupation_code`
        field of individual KYC submissions.
      responses:
        '200':
          description: List of occupation codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        display_name:
                          type: string
                          example: Software developer
                        code:
                          type: string
                          example: '151252'

  /auth/verification-locations:
    get:
      tags: [KYC / KYB]
      summary: Get Verification Locations
      description: |
        Returns all countries where Yativo supports customer registration and KYC/KYB verification.
        Use this to validate customer country selections in onboarding flows.
      responses:
        '200':
          description: List of supported countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        country:
                          type: string
                          example: United States
                        code:
                          type: string
                          example: US

  # ============================================================
  # CUSTOMERS
  # ============================================================

  /customer:
    get:
      tags: [Customers]
      summary: List Customers
      description: Returns all customers associated with your account, paginated and filterable.
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: email
          in: query
          schema:
            type: string
          description: Filter by email (partial match).
        - name: country
          in: query
          schema:
            type: string
          description: Filter by ISO 3166-1 alpha-3 country code (e.g. USA, BRA).
        - name: kyc_status
          in: query
          schema:
            type: string
          description: Filter by KYC status.
        - name: is_kyc_approved
          in: query
          schema:
            type: boolean
          description: Filter by KYC approval status.
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Customers]
      summary: Create Customer
      description: |
        Create a customer record before initiating KYC verification or payments for that customer.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, customer_email, customer_phone, customer_country, customer_type]
              properties:
                customer_name:
                  type: string
                  description: Full name (individual) or legal business name.
                  example: Alex Smith
                customer_email:
                  type: string
                  format: email
                  description: Must be unique per account.
                  example: alex.smith@example.com
                customer_phone:
                  type: string
                  description: Phone in E.164 format (e.g. +15551234567).
                  example: '+15551234567'
                customer_country:
                  type: string
                  description: ISO 3166-1 alpha-3 (e.g. USA, BRA, MEX).
                  example: USA
                customer_type:
                  type: string
                  enum: [individual, business]
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /customer/{customer_id}:
    get:
      tags: [Customers]
      summary: Get Customer
      description: |
        Returns a customer's profile. Use the `include` query parameter to embed related data:
        deposits, payouts, virtual accounts, virtual cards, and/or crypto wallets.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the customer to retrieve.
        - name: include
          in: query
          schema:
            type: string
          description: |
            Comma-separated list of relations to embed. Values: `deposits`, `payouts`,
            `virtualaccounts`, `virtual_cards`, `crypto_wallets`, `all`.
          example: deposits,virtualaccounts
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Customers]
      summary: Update Customer
      description: |
        Full replacement of a customer's profile. All required fields must be provided on every call.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, customer_name, customer_email, customer_phone, customer_country, customer_address]
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Must match the path parameter.
                customer_name:
                  type: string
                customer_email:
                  type: string
                  format: email
                customer_phone:
                  type: string
                customer_country:
                  type: string
                  description: ISO 3166-1 alpha-3.
                customer_address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postal_code:
                      type: string
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Customer'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # ============================================================
  # KYC / KYB
  # ============================================================

  /customer/kyc/{customer_id}:
    get:
      tags: [KYC / KYB]
      summary: Check KYC Status
      description: |
        Poll this endpoint after a KYC/KYB submission to check verification status.
        When `status` is `approved` and `is_va_approved` is `true`, the customer can use payment services.

        **Status values:**
        - `not_started` — no submission yet
        - `submitted` — awaiting review
        - `manual_review` — under manual review
        - `approved` — fully verified
        - `rejected` — rejected (see `kyc_rejection_reasons`)
        - `under_review` — additional review in progress
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the customer.
      responses:
        '200':
          description: KYC status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      first_name:
                        type: string
                      last_name:
                        type: string
                      status:
                        type: string
                        enum: [not_started, submitted, manual_review, approved, rejected, under_review]
                      kyc_rejection_reasons:
                        type: array
                        items:
                          type: string
                      kyc_requirements_due:
                        type: array
                        items:
                          type: string
                      bio_data:
                        type: object
                      kyc_link:
                        type: string
                      is_va_approved:
                        type: boolean

  /customer/kyc/update:
    put:
      tags: [KYC / KYB]
      summary: Update KYC Submission
      description: |
        Update a previously submitted KYC or KYB record. Supply `customer_id` and `type`,
        then any fields to change. Fields not included are left unchanged.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, type]
              properties:
                customer_id:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum: [individual, business]
                  description: Must match the original submission type.
      responses:
        '200':
          description: KYC submission updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                      type:
                        type: string
                      status:
                        type: string
                      updated_at:
                        type: string
                        format: date-time
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # NOTE: KYC submission endpoints are on https://kyc.yativo.com, not the main API base.
  # They are included here for completeness with their full server override noted.

  /individual-kyc/submit:
    post:
      tags: [KYC / KYB]
      summary: Submit Individual KYC
      description: |
        **Base URL for this endpoint: `https://kyc.yativo.com/api`**

        Submit KYC data for an individual customer. The customer must already exist (via `POST /customer`).
        Status will be `submitted` then move to `approved` once review is complete.
        Requires an `Idempotency-Key` header.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - first_name
                - last_name
                - email
                - calling_code
                - phone
                - birth_date
                - nationality
                - gender
                - taxId
                - selfie_image
                - residential_address
                - identifying_information
                - employment_status
                - most_recent_occupation_code
                - expected_monthly_payments_usd
                - source_of_funds
                - account_purpose
              properties:
                customer_id:
                  type: string
                  format: uuid
                first_name:
                  type: string
                  maxLength: 1024
                last_name:
                  type: string
                  maxLength: 1024
                middle_name:
                  type: string
                email:
                  type: string
                  format: email
                calling_code:
                  type: string
                  pattern: '^\+\d{1,4}$'
                  example: '+1'
                phone:
                  type: string
                  description: Digits only, 8–15 characters. Do not include country code.
                  minLength: 8
                  maxLength: 15
                birth_date:
                  type: string
                  format: date
                  description: The customer must be at least 18.
                nationality:
                  type: string
                  description: ISO 3166-1 alpha-2 (e.g. US, NG, BR).
                  minLength: 2
                  maxLength: 2
                gender:
                  type: string
                  enum: [male, female]
                taxId:
                  type: string
                  maxLength: 255
                  pattern: '^[A-Za-z0-9]+$'
                  description: Letters and digits only.
                selfie_image:
                  type: string
                  description: Hosted URL, base64 data URI or multipart file. PDF/JPG/JPEG/PNG/HEIC/TIF, 5 KB–30 MB.
                bvn:
                  type: string
                  description: Required when nationality or residential_address.country is NG. Exactly 11 digits.
                  minLength: 11
                  maxLength: 11
                nin:
                  type: string
                  description: Required when nationality or residential_address.country is NG. Exactly 11 digits.
                  minLength: 11
                  maxLength: 11
                residential_address:
                  $ref: '#/components/schemas/ResidentialAddress'
                identifying_information:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/IdentifyingInformationItem'
                employment_status:
                  type: string
                  enum: [employed, exempt, homemaker, retired, self_employed, student, unemployed]
                most_recent_occupation_code:
                  type: string
                  description: 6-digit code from GET /auth/occupation-codes.
                  example: '151252'
                expected_monthly_payments_usd:
                  type: string
                  enum: ['0_4999', '5000_9999', '10000_49999', '50000_plus']
                source_of_funds:
                  type: string
                  enum:
                    - salary
                    - company_funds
                    - savings
                    - investments_loans
                    - inheritance
                    - gifts
                    - government_benefits
                    - pension_retirement
                    - sale_of_assets_real_estate
                    - ecommerce_reseller
                    - gambling_proceeds
                    - someone_elses_funds
                account_purpose:
                  type: string
                  enum:
                    - receive_salary
                    - purchase_goods_and_services
                    - personal_or_living_expenses
                    - payments_to_friends_or_family_abroad
                    - receive_payment_for_freelancing
                    - investment_purposes
                    - protect_wealth
                    - ecommerce_retail_payments
                    - operating_a_company
                    - charitable_donations
                    - other
                account_purpose_other:
                  type: string
                  description: Required when account_purpose is "other".
                acting_as_intermediary:
                  type: boolean
                  default: false
                annual_salary:
                  type: string
                  maxLength: 20
                current_employer:
                  type: string
                  maxLength: 512
                immigration_status:
                  type: string
                  enum: [Permanent U.S. Resident, Non-Permanent U.S. Resident, Non-Resident of U.S.]
                usd_virtual_account:
                  type: boolean
                eur_virtual_account:
                  type: boolean
                gbp_virtual_account:
                  type: boolean
                native_endorsement:
                  type: boolean
                uploaded_documents:
                  type: array
                  items:
                    $ref: '#/components/schemas/UploadedDocumentItem'
      responses:
        '201':
          description: KYC submitted. Verification runs afterwards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: KYC submitted successfully.
                  data:
                    type: object
                    description: The saved submission.
                    properties:
                      customer_id:
                        type: string
                      type:
                        type: string
                        example: individual
                      status:
                        type: string
                        example: submitted
                      submitted_at:
                        type: string
                        format: date-time
                  warnings:
                    type: object
                    description: Fields verification is likely to reject, such as values not on the lookup lists. Only present when there are warnings.
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycValidationError'

  /business-kyc/submit:
    post:
      tags: [KYC / KYB]
      summary: Submit Business KYB
      description: |
        **Base URL for this endpoint: `https://kyc.yativo.com/api`**

        Submit KYB data for a business customer. The customer must already exist with
        `customer_type: "business"`, or the request returns `404`. A successful response means the data
        was accepted. Verification runs afterwards.

        Associated persons below `ownership_threshold` (default 25) are dropped. At least one person must
        meet it, and the combined ownership of persons with `has_ownership: true` can't exceed 100.
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - business_legal_name
                - business_trade_name
                - business_description
                - email
                - business_type
                - registration_number
                - incorporation_date
                - primary_website
                - registered_address
                - physical_address
                - associated_persons
                - account_purpose
                - source_of_funds
                - expected_monthly_payments_usd
                - high_risk_activities
                - pep_status
                - third_party_msb_payments
                - documents
                - extra_documents
              properties:
                customer_id:
                  type: string
                business_legal_name:
                  type: string
                  maxLength: 255
                business_trade_name:
                  type: string
                  maxLength: 255
                business_description:
                  type: string
                  minLength: 140
                  maxLength: 5000
                email:
                  type: string
                  format: email
                business_type:
                  type: string
                  enum: [cooperative, corporation, llc, partnership, sole_prop, trust, other]
                registration_number:
                  type: string
                  maxLength: 100
                incorporation_date:
                  type: string
                  format: date
                  description: Before today.
                incorporation_country:
                  type: string
                  description: ISO 3166-1 alpha-2.
                tax_id:
                  type: string
                  maxLength: 255
                  pattern: '^[A-Za-z0-9]+$'
                  description: Required unless identifying_information is sent. Letters and digits only.
                phone_calling_code:
                  type: string
                  pattern: '^\+[1-9]\d{0,3}$'
                phone_number:
                  type: string
                  pattern: '^\d{7,15}$'
                business_industry:
                  type: string
                primary_website:
                  type: string
                  format: uri
                is_dao:
                  type: boolean
                statement_descriptor:
                  type: string
                  maxLength: 22
                registered_address:
                  $ref: '#/components/schemas/KybAddress'
                physical_address:
                  $ref: '#/components/schemas/KybAddress'
                associated_persons:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [first_name, last_name, birth_date, nationality, email, ownership_percentage, residential_address, identifying_information]
                    properties:
                      first_name:
                        type: string
                        maxLength: 100
                      last_name:
                        type: string
                        maxLength: 100
                      birth_date:
                        type: string
                        format: date
                        description: The person must be at least 18.
                      nationality:
                        type: string
                      email:
                        type: string
                        format: email
                      phone:
                        type: string
                        pattern: '^\d{7,15}$'
                      title:
                        type: string
                      ownership_percentage:
                        type: number
                        minimum: 0
                        maximum: 100
                      tax_id:
                        type: string
                        pattern: '^[A-Za-z0-9]+$'
                      annual_salary:
                        type: string
                        maxLength: 20
                      relationship_established_at:
                        type: string
                        format: date
                      residential_address:
                        $ref: '#/components/schemas/KybAddress'
                      identifying_information:
                        type: array
                        minItems: 1
                        description: At least one entry that isn't a tax ID.
                        items:
                          type: object
                          required: [type, number, image_front]
                          properties:
                            type:
                              type: string
                              example: passport
                            number:
                              type: string
                            issuing_country:
                              type: string
                            expiration:
                              type: string
                              format: date
                            image_front:
                              type: string
                              description: File. Not required for tax_id.
                            image_back:
                              type: string
                              description: File. Required except for passport and tax_id.
                      has_ownership:
                        type: boolean
                      has_control:
                        type: boolean
                      is_signer:
                        type: boolean
                      is_director:
                        type: boolean
                account_purpose:
                  type: string
                  enum: [charitable_donations, ecommerce_retail_payments, investment_purposes, other, payments_to_friends_or_family_abroad, payroll, personal_or_living_expenses, protect_wealth, purchase_goods_and_services, receive_payments_for_goods_and_services, tax_optimization, third_party_money_transmission, treasury_management]
                account_purpose_other:
                  type: string
                  description: Required when account_purpose is other.
                source_of_funds:
                  type: string
                  enum: [BusinessLoans, Grants, InterCompanyFunds, InvestmentProceeds, LegalSettlement, OwnersCapital, PensionRetirement, SaleOfAssets, SalesOfGoodsAndServices, ThirdPartyFunds, TreasuryReserves]
                expected_monthly_payments_usd:
                  type: integer
                  minimum: 1
                high_risk_activities:
                  type: array
                  items:
                    type: string
                    enum: [adult_entertainment, gambling, hold_client_funds, investment_services, lending_banking, marijuana_or_related_services, money_services, nicotine_tobacco_or_related_services, operate_foreign_exchange_virtual_currencies_brokerage_otc, pharmaceuticals, precious_metals_precious_stones_jewelry, safe_deposit_box_rentals, third_party_payment_processing, weapons_firearms_and_explosives, none_of_the_above]
                high_risk_activities_explanation:
                  type: string
                  maxLength: 5000
                pep_status:
                  type: boolean
                third_party_msb_payments:
                  type: boolean
                conducts_money_services:
                  type: boolean
                conducts_money_services_description:
                  type: string
                compliance_screening_explanation:
                  type: string
                estimated_annual_revenue_usd:
                  type: string
                operates_in_prohibited_countries:
                  type: string
                  enum: ['yes', 'no']
                ownership_threshold:
                  type: integer
                  minimum: 5
                  maximum: 100
                  default: 25
                has_material_intermediary_ownership:
                  type: boolean
                regulated_activity:
                  type: object
                  properties:
                    regulated_activities_description:
                      type: string
                    primary_regulatory_authority_country:
                      type: string
                    primary_regulatory_authority_name:
                      type: string
                    license_number:
                      type: string
                documents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [purpose, description, file]
                    properties:
                      purpose:
                        type: string
                        enum: [business_registration, proof_of_address, tax_documents, compliance_documents, financial_statements, certificate_of_good_standing, portfolio_statement, board_minutes]
                      description:
                        type: string
                      file:
                        type: string
                extra_documents:
                  type: array
                  description: Must include shareholding_structure, and board_resolution when a signer isn't a director.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: shareholding_structure
                      file:
                        type: string
                identifying_information:
                  type: array
                  description: Business-level documents. image_front is required when type is tax_id.
                  items:
                    type: object
                usd_virtual_account:
                  type: boolean
                eur_virtual_account:
                  type: boolean
                gbp_virtual_account:
                  type: boolean
                native_endorsement:
                  type: boolean
      responses:
        '200':
          description: KYB data accepted. Verification runs afterwards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: All data submitted successfully.
                  business_data:
                    type: object
        '404':
          description: Business with the provided Customer_ID not found.
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycValidationError'

  /kyc/regenerate/{customerId}/{service}:
    get:
      tags: [KYC / KYB]
      summary: Regenerate Endorsement Link
      description: |
        **Base URL for this endpoint: `https://kyc.yativo.com/api`**

        Generate a fresh verification link for an expired service endorsement.
        Share the new link with the customer to complete verification for the specific payment service.

        **Services:** `base`, `sepa`, `spei`, `brazil`, `eurde`, `usd_latam`, `eur_latam`,
        `virtual_card`, `asian`, `native`, `cobo_pobo`
      servers:
        - url: https://kyc.yativo.com/api
          description: KYC Platform
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum: [base, sepa, spei, brazil, eurde, usd_latam, eur_latam, virtual_card, asian, native, cobo_pobo]
      responses:
        '200':
          description: Endorsement link regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      customer_id:
                        type: string
                      service:
                        type: string
                      link:
                        type: string
                      expires_at:
                        type: string
                        format: date-time

  # ============================================================
  # PAYMENTS & TRANSFERS
  # ============================================================

  /exchange-rate:
    post:
      tags: [Payments & Transfers]
      summary: Get Exchange Rate / Create Quote
      description: |
        Returns a real-time exchange rate, fee breakdown, and a `quote_id` valid for **5 minutes**.
        Pass the `quote_id` to `POST /wallet/payout` or `POST /wallet/deposits/new` to execute the
        transaction at the quoted rate. Rate-limited to **30 requests per minute**.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_currency, to_currency, amount]
              properties:
                from_currency:
                  type: string
                  description: Source currency code (ISO 4217).
                  example: USD
                to_currency:
                  type: string
                  description: Target currency code (ISO 4217).
                  example: CLP
                amount:
                  type: number
                  description: Amount in the source currency to convert.
                  example: 500
                method_id:
                  type: integer
                  description: Payment method ID. When provided, scopes the quote to that rail and applies its exact fee structure.
                method_type:
                  type: string
                  enum: [payout, payin]
                  description: Required when method_id is provided.
                amount_type:
                  type: string
                  enum: [send, receive]
                  default: send
                  description: |
                    Payout quotes only. `send`: `amount` is what leaves your wallet, in `from_currency`.
                    `receive`: `amount` is what the customer receives, in `to_currency`; the quote works
                    out the send amount and fees. `receive` with `method_type: payin` returns 422.
      responses:
        '200':
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      quote_id:
                        type: string
                        format: uuid
                        description: Valid for 5 minutes. Use in payout or deposit execution.
                      quote_expire_at:
                        type: string
                        format: date-time
                        description: When the quote expires.
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      rate:
                        type: string
                      amount:
                        type: string
                        description: The send amount, in from_currency. Calculated for you in receive mode.
                      amount_type:
                        type: string
                        enum: [send, receive]
                        description: Payout quotes only.
                      receive_amount:
                        type: string
                        description: Only in receive mode. The amount the customer receives, in to_currency.
                      payout_data:
                        type: object
                        properties:
                          total_transaction_fee_in_from_currency:
                            type: string
                          total_transaction_fee_in_to_currency:
                            type: string
                          customer_sent_amount:
                            type: string
                          customer_receive_amount:
                            type: string
                          customer_total_amount_due:
                            type: string
                      calculator:
                        type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid amount_type, or amount_type receive on a payin quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (30 requests/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /exchange-rates:
    get:
      tags: [Payments & Transfers]
      summary: Get Market Rates
      description: |
        Current indicative market rate for every wallet currency Yativo supports, quoted as
        "1 `base` = `rate` units of that currency". Rates refresh about once a minute and don't
        include fees. To price a specific payout or deposit with fees, use `POST /exchange-rate`.

        Limited to **one request per minute** per account. Team members need the
        **Currency Exchange → view** permission.
      parameters:
        - name: base
          in: query
          required: false
          description: The currency rates are quoted against. Must be a supported wallet currency.
          schema:
            type: string
            default: USD
            example: USD
      responses:
        '200':
          description: Current rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      base:
                        type: string
                        example: USD
                      rates:
                        type: object
                        description: One entry per supported wallet currency. `null` means no rate is available right now.
                        additionalProperties:
                          type: number
                          nullable: true
                        example:
                          ARS: 1185.5
                          BRL: 5.4321
                          EUR: 0.9187
                          MXN: 18.6024
                          USD: 1
                      updated_at:
                        type: string
                        format: date-time
                        description: When the rates were last refreshed (UTC).
                        example: '2026-10-01T12:00:00+00:00'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Team member without the Currency Exchange view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: base is not a supported wallet currency. The error lists the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than one request in a minute. The Retry-After header says how many seconds to wait.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Rates are temporarily unavailable. Try again shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fees:
    get:
      tags: [Payments & Transfers]
      summary: Get Fee Schedule
      description: |
        The fees your account is charged for every service it can use. Each line shows the fixed fee,
        the percentage fee and the minimum and maximum charge. Lines with custom pricing for your
        account have `source: custom`; the rest show your plan's default rate (`source: default`).

        Team members need the **Billing & Plans → view** permission.
      responses:
        '200':
          description: Fee schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      plan_id:
                        type: integer
                        example: 2
                      payin:
                        type: array
                        description: Every active payin method. `gateway_id` is the method ID used for deposits and quotes.
                        items:
                          $ref: '#/components/schemas/MethodFeeLine'
                      payout:
                        type: array
                        description: Every active payout method. `gateway_id` is the payout method ID.
                        items:
                          $ref: '#/components/schemas/MethodFeeLine'
                      virtual_account:
                        type: array
                        description: Deposit fees per virtual-account currency. A currency whose fee depends on the network it arrives on has one line per network.
                        items:
                          allOf:
                            - type: object
                              properties:
                                currency:
                                  type: string
                                  example: USD
                                display_currency:
                                  type: string
                                  example: USD
                                network:
                                  type: string
                                  nullable: true
                                  example: ACH
                            - $ref: '#/components/schemas/FeeLine'
                      virtual_card:
                        type: array
                        description: 'Virtual card actions: card_creation, topup, charge_back, card_termination, card_decline.'
                        items:
                          allOf:
                            - type: object
                              properties:
                                action:
                                  type: string
                                  example: card_creation
                            - $ref: '#/components/schemas/FeeLine'
                      employee_card:
                        type: array
                        nullable: true
                        description: Employee card actions. `null` if your business isn't enabled for employee cards. Free actions are left out.
                        items:
                          allOf:
                            - type: object
                              properties:
                                action:
                                  type: string
                                  example: virtual_card_create
                                waive_above:
                                  type: number
                                  nullable: true
                                  description: The fee is waived when the transaction amount is above this value. `null` = never waived.
                            - $ref: '#/components/schemas/FeeLine'
        '401':
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Team member without the Billing & Plans view permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sendmoney/quote:
    post:
      tags: [Payments & Transfers]
      summary: Get Send Money Quote
      description: |
        Generates a rate-locked quote for a cross-border payment. The quote guarantees the
        displayed rate and fee for **5 minutes**. Use the returned `quote_id` when executing
        with `POST /sendmoney`. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_currency, to_currency, amount]
              properties:
                from_currency:
                  type: string
                  example: USD
                to_currency:
                  type: string
                  example: MXN
                amount:
                  type: number
                  example: 200
      responses:
        '200':
          description: Quote created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      quote_id:
                        type: string
                        format: uuid
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      rate:
                        type: string
                      amount:
                        type: string
                      payout_data:
                        type: object

  /sendmoney:
    post:
      tags: [Payments & Transfers]
      summary: Send Money
      description: |
        Execute a cross-border payment using a quote ID obtained from `POST /sendmoney/quote`.
        The quote locks the exchange rate for 5 minutes.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  format: uuid
                  description: Quote ID from POST /sendmoney/quote. Valid for 5 minutes.
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                      status:
                        type: string
                        example: pending
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      amount:
                        type: string
                      rate:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Quote expired or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-methods/payout:
    get:
      tags: [Payments & Transfers]
      summary: Get Payout Methods
      description: |
        Returns payout methods (banks, mobile wallets, etc.) available for a given destination country.
        Use the returned `id` as `payment_method_id` when creating payouts or adding beneficiary payment methods.
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
          description: Destination country in ISO 3166-1 alpha-3 (e.g. CHL, MEX, PER).
          example: CHL
      responses:
        '200':
          description: List of payout methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        method_name:
                          type: string
                        country:
                          type: string
                        currency:
                          type: string
                        base_currency:
                          type: string

  /payment-methods/payout/countries:
    get:
      tags: [Payments & Transfers]
      summary: Get Supported Payout Countries
      description: Returns all countries where Yativo supports outgoing payments.
      responses:
        '200':
          description: List of supported countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        iso3:
                          type: string
                          example: CHL
                        iso2:
                          type: string
                          example: CL
                        name:
                          type: string
                          example: Chile

  /payment-methods/payin:
    get:
      tags: [Payments & Transfers]
      summary: Get Payin Methods
      description: Returns available payin (deposit) methods for a given country.
      parameters:
        - name: country
          in: query
          schema:
            type: string
          description: Country in ISO 3166-1 alpha-2 or alpha-3.
      responses:
        '200':
          description: List of payin methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      type: object

  /beneficiary/form/show/{payment_method_id}:
    get:
      tags: [Payments & Transfers]
      summary: Get Payout Form Fields
      description: |
        Returns the dynamic form fields required to add a beneficiary payment method or execute a payout.
        Fields vary by country and payment method. Use the `id` from `GET /payment-methods/payout`.
      parameters:
        - name: payment_method_id
          in: path
          required: true
          schema:
            type: integer
          description: Payment method ID from GET /payment-methods/payout.
          example: 42
      responses:
        '200':
          description: Form field definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_id:
                    type: integer
                  currency:
                    type: string
                  form_data:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        type:
                          type: string
                        required:
                          type: boolean
                        options:
                          type: array
                          items:
                            type: object
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time

  /wallet/payout:
    post:
      tags: [Payments & Transfers]
      summary: Initiate Payout (Wallet)
      description: |
        Initiate an outgoing payment to a beneficiary from your wallet.
        Use a `quote_id` to lock the exchange rate for 5 minutes.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_wallet, payment_method_id, customer_id]
              properties:
                debit_wallet:
                  type: string
                  description: Wallet currency to debit (e.g. USD, EUR).
                  example: USD
                payment_method_id:
                  type: integer
                  description: The customer's saved payout method ID, from POST /beneficiaries/payment-methods.
                  example: 555
                customer_id:
                  type: string
                  description: The customer the payout method belongs to.
                  example: da44a3e6-eb5d-429f-8d17-357aa5a6cdf2
                quote_id:
                  type: string
                  format: uuid
                  description: Recommended. A payout quote from POST /exchange-rate. Supplies the amount, so amount and amount_type are ignored.
                amount:
                  type: number
                  description: Required if quote_id is not provided. With amount_type send, the amount to send in debit_wallet. With amount_type receive, the amount the customer receives in the payout currency.
                amount_type:
                  type: string
                  enum: [send, receive]
                  default: send
                  description: Ignored when quote_id is provided. Fees are added on top in both modes.
                reference:
                  type: string
                  maxLength: 250
                  description: Payment reference passed to the recipient's bank. Some payout rails shorten it or remove unsupported characters.
                invoice:
                  type: string
                  format: binary
                  description: Supporting invoice (PDF, PNG or JPEG, up to 15 MB). Send as multipart/form-data.
                invoice_url:
                  type: string
                  format: uri
                  description: Public http(s) link to the supporting invoice, as an alternative to invoice.
      responses:
        '201':
          description: Payout initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: integer
                        description: Use with GET /transaction/tracking/{id}.
                      payout_id:
                        type: integer
                        description: Use with GET /payout/fetch/{payout_id}.
                      status:
                        type: string
                        example: pending
                      amount_type:
                        type: string
                        enum: [send, receive]
                      send_amount:
                        type: number
                        description: Amount sent, in the debit wallet currency, before fees.
                      customer_receive_amount:
                        type: number
                        description: Amount the customer receives, in currency.
                      debit_amount:
                        type: number
                        description: Total debited from your wallet, fees included.
                      currency:
                        type: string
                        description: The payout currency.
                      fees:
                        type: object
                        description: Full fee and rate breakdown.
                      processed_at:
                        type: string
                        format: date-time
        '400':
          description: Insufficient balance, expired quote, or amount outside the method's limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: amount_type is not send or receive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # DEPOSITS
  # ============================================================

  /wallet/deposits/new:
    post:
      tags: [Deposits]
      summary: Create Deposit (Payin)
      description: |
        Initiate a customer deposit via a supported payin gateway. Optionally pass a `quote_id`
        from `POST /exchange-rate` (with `method_type: "payin"`) to lock the rate.
        After a successful response, redirect the customer to `deposit_url`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway, currency]
              properties:
                gateway:
                  type: integer
                  description: Payin gateway ID from GET /payment-methods/payin.
                currency:
                  type: string
                  description: Wallet currency to credit (e.g. USD, BRL).
                  example: USD
                amount:
                  type: number
                  description: Amount in local payin currency. Required if quote_id is not provided.
                quote_id:
                  type: string
                  format: uuid
                  description: From POST /exchange-rate with method_type payin. Overrides amount.
                redirect_url:
                  type: string
                  format: uri
                  description: URL to redirect customer after payment completes.
      responses:
        '200':
          description: Deposit initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      gateway:
                        type: integer
                      deposit_currency:
                        type: string
                      amount:
                        type: number
                      receive_amount:
                        type: number
                      currency_to:
                        type: string
                      status:
                        type: string
                      deposit_url:
                        type: string
                        description: Redirect customer here to complete payment.
                      transaction_id:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Expired quote / below minimum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Gateway not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /wallet/deposits:
    get:
      tags: [Deposits]
      summary: List Deposits
      description: Returns a list of all payin deposits for your account, with filtering and pagination.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: gateway
          in: query
          schema:
            type: string
        - name: currency
          in: query
          schema:
            type: string
          example: BRL
        - name: customer_id
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated deposit list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        gateway:
                          type: integer
                        deposit_currency:
                          type: string
                        amount:
                          type: number
                        receive_amount:
                          type: number
                        currency_to:
                          type: string
                        status:
                          type: string
                        transaction_id:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  # ============================================================
  # VIRTUAL ACCOUNTS
  # ============================================================

  /business/virtual-account/create:
    post:
      tags: [Virtual Accounts]
      summary: Create Virtual Account
      description: |
        Create a virtual bank account for a customer. The customer must have KYC approved
        (`is_va_approved: true`). Each customer can hold one virtual account per currency.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency:
                  type: string
                  description: |
                    Currency for the virtual account. Supported: MXN, BRL, USD, EUR, MXN_USD,
                    MXN_BASE, MXNBASE, EURBASE, USDBASE, EUR_BASE, USD_BASE, EURDE, USDDE, GBP,
                    USD_KIRA, USDKIRA.
                  example: BRL
                customer_id:
                  type: string
                  format: uuid
                  description: Required when currency is USD.
      responses:
        '201':
          description: Virtual account creation in progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualAccount'

  /business/virtual-account:
    get:
      tags: [Virtual Accounts]
      summary: List Virtual Accounts
      description: Returns all virtual accounts for your business with optional filtering.
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          example: BRL
        - name: status
          in: query
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of virtual accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccount'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /business/virtual-account/show/{externalId}:
    get:
      tags: [Virtual Accounts]
      summary: Get Virtual Account
      description: Returns full details for a specific virtual account by its external ID.
      parameters:
        - name: externalId
          in: path
          required: true
          schema:
            type: string
          description: The external ID of the virtual account.
      responses:
        '200':
          description: Virtual account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualAccount'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/virtual-account/delete-virtual-account/{account_id}:
    delete:
      tags: [Virtual Accounts]
      summary: Delete Virtual Account
      description: Permanently deletes a virtual account. This action is irreversible.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    nullable: true

  /business/virtual-account/history/{accountNumber}:
    get:
      tags: [Virtual Accounts]
      summary: Virtual Account Transaction History
      description: Returns all payments received into a specific virtual account.
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          description: The account number (not account ID).
      responses:
        '200':
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccountHistory'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /business/virtual-account/histories:
    get:
      tags: [Virtual Accounts]
      summary: All Virtual Account Histories
      description: |
        Returns deposit histories across all virtual accounts for your business.
        Consolidated view of all incoming payments.
      responses:
        '200':
          description: All histories
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccountHistory'

  /business/virtual-account/customer/accounts/{customerId}:
    get:
      tags: [Virtual Accounts]
      summary: Customer Virtual Accounts
      description: Returns all virtual accounts associated with a specific customer.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer virtual accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualAccount'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # WALLETS
  # ============================================================

  /wallet/balance:
    get:
      tags: [Wallets]
      summary: Get Wallet Balance
      description: Returns current balance for all wallets on your account.
      responses:
        '200':
          description: All wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletBalance'

  /wallet/balance/total:
    get:
      tags: [Wallets]
      summary: Get Total Balance (USD)
      description: Returns the sum of all wallet balances converted to USD.
      responses:
        '200':
          description: Total balance in USD
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total_balance:
                        type: number
                        example: 37629.18

  /wallet/create:
    post:
      tags: [Wallets]
      summary: Create Wallet
      description: |
        Create a new wallet to hold a specific currency. Once created, it appears in your
        balance list with a zero balance. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency:
                  type: string
                  description: Currency code for the new wallet (e.g. COP, PEN, ARS, CLP).
                  example: COP
      responses:
        '201':
          description: Wallet created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      currency:
                        type: string
                      balance:
                        type: string
                        example: '0.00'
                      created_at:
                        type: string
                        format: date-time

  /wallet/payouts:
    get:
      tags: [Wallets]
      summary: List Wallet Payouts
      description: Returns a list of payout (withdrawal) transactions made from your wallets.
      responses:
        '200':
          description: List of wallet payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        amount:
                          type: string
                        currency:
                          type: string
                        status:
                          type: string
                        recipient:
                          type: string
                        reference:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  # ============================================================
  # BENEFICIARIES
  # ============================================================

  /beneficiaries/list:
    get:
      tags: [Beneficiaries]
      summary: List Beneficiaries
      description: Returns a paginated list of all beneficiaries in your account.
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated beneficiary list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Beneficiary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /beneficiaries:
    post:
      tags: [Beneficiaries]
      summary: Create Beneficiary
      description: |
        Create a beneficiary record to store recipient information for future payouts.
        After creating, add payment method details via `POST /beneficiaries/payment-methods`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_type, customer_name, customer_email, customer_address, country]
              properties:
                recipient_type:
                  type: string
                  enum: [individual, business]
                customer_name:
                  type: string
                customer_email:
                  type: string
                  format: email
                customer_address:
                  type: string
                country:
                  type: string
                  description: ISO 3166-1 alpha-3 (e.g. CHL, MEX, BRA).
                customer_nickname:
                  type: string
      responses:
        '200':
          description: Beneficiary created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/Beneficiary'

  /beneficiaries/{id}:
    get:
      tags: [Beneficiaries]
      summary: Get Beneficiary
      description: Returns full details for a specific beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Beneficiary details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/Beneficiary'

    put:
      tags: [Beneficiaries]
      summary: Update Beneficiary
      description: |
        Full replacement of a beneficiary's profile. All required fields must be provided.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_type, customer_name, customer_email, customer_address, country]
              properties:
                recipient_type:
                  type: string
                  enum: [individual, business]
                customer_name:
                  type: string
                customer_email:
                  type: string
                  format: email
                customer_address:
                  type: string
                country:
                  type: string
                customer_nickname:
                  type: string
      responses:
        '200':
          description: Beneficiary updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags: [Beneficiaries]
      summary: Delete Beneficiary
      description: Permanently delete a beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /beneficiaries/{id}/archive:
    put:
      tags: [Beneficiaries]
      summary: Archive Beneficiary
      description: Archive a beneficiary to hide them without permanent deletion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                type: object

  /beneficiaries/{id}/unarchive:
    put:
      tags: [Beneficiaries]
      summary: Unarchive Beneficiary
      description: Restore a previously archived beneficiary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unarchived
          content:
            application/json:
              schema:
                type: object

  /beneficiaries/payment-methods/all:
    get:
      tags: [Beneficiaries]
      summary: List Payment Methods
      description: Returns all saved payment methods across all beneficiaries in your account.
      responses:
        '200':
          description: All payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods:
    post:
      tags: [Beneficiaries]
      summary: Add Payment Method
      description: |
        Add a payment method (bank account, wallet) to a beneficiary.
        The structure of `payment_data` varies by payment method — retrieve required fields
        from `GET /beneficiary/form/show/{payment_method_id}`.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id, payment_data, currency, nickname]
              properties:
                gateway_id:
                  type: integer
                  description: Payout method ID from GET /payment-methods/payout.
                payment_data:
                  type: object
                  description: Account details. Fields vary by gateway_id.
                  additionalProperties: true
                currency:
                  type: string
                  example: CLP
                nickname:
                  type: string
                beneficiary_id:
                  type: string
      responses:
        '200':
          description: Payment method added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods/{id}:
    post:
      tags: [Beneficiaries]
      summary: Get Payment Method
      description: Retrieve a specific beneficiary payment method by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Payment method details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods/update/{id}:
    put:
      tags: [Beneficiaries]
      summary: Update Payment Method
      description: |
        Full replacement of a beneficiary payment method. All required fields must be provided.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id, currency, payment_data, nickname]
              properties:
                gateway_id:
                  type: integer
                currency:
                  type: string
                payment_data:
                  type: object
                  additionalProperties: true
                nickname:
                  type: string
      responses:
        '200':
          description: Payment method updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/BeneficiaryPaymentMethod'

  /beneficiaries/payment-methods/delete/{id}:
    delete:
      tags: [Beneficiaries]
      summary: Delete Payment Method
      description: Permanently delete a saved beneficiary payment method.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ============================================================
  # TRANSACTIONS
  # ============================================================

  /business/transactions/index:
    get:
      tags: [Transactions]
      summary: List Transactions
      description: |
        Returns all transactions (deposits, payouts, virtual account receipts, card transactions)
        for your account with filtering and pagination.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [success, complete, detected, pending, 'In Progress', failed]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: amount
          in: query
          schema:
            type: number
        - name: customer_id
          in: query
          schema:
            type: string
        - name: transaction_type
          in: query
          schema:
            type: string
            enum: [deposit, payout, virtual_account, transfer, card_transaction, crypto_deposit]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/Pagination'

  /business/transaction/show/{id}:
    get:
      tags: [Transactions]
      summary: Get Transaction
      description: Returns complete details for a single transaction by its internal numeric ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Internal numeric transaction ID (the `id` field, not the UUID).
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Transaction'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transaction/tracking/{quote_id}:
    get:
      tags: [Transactions]
      summary: Track Transaction
      description: Returns a step-by-step timeline of a transaction's progress.
      parameters:
        - name: quote_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The quote_id associated with the transaction.
      responses:
        '200':
          description: Transaction timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tracking_status:
                          type: string
                        transaction_type:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  /transaction/track:
    get:
      tags: [Transactions]
      summary: Track Transaction by ID
      description: |
        Look up a transaction by its transaction ID and type. Returns a direct lookup by the
        transaction's own ID (distinct from the timeline tracking endpoint).
      parameters:
        - name: txn_id
          in: query
          required: true
          schema:
            type: string
          description: The transaction ID to look up.
        - name: txn_type
          in: query
          required: true
          schema:
            type: string
            enum: [payout, payin, swap]
      responses:
        '200':
          description: Transaction record
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      transaction_id:
                        type: string
                      type:
                        type: string
                      amount:
                        type: string
                      currency:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/transaction/{transactionId}/{type}/receipt:
    get:
      tags: [Transactions]
      summary: Download Receipt
      description: |
        Returns a receipt for a completed transaction. Pass `pdf` as `type` to receive a
        base64-encoded PDF, or use `json` for structured data.
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [pdf, json]
      responses:
        '200':
          description: Receipt (base64 PDF when type=pdf)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: string
                    description: Base64-encoded PDF when type is pdf.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # VIRTUAL CARDS
  # ============================================================

  /customer/virtual/cards/activate:
    post:
      tags: [Virtual Cards]
      summary: Activate Customer for Virtual Cards
      description: |
        Registers a customer for virtual card creation. Required before issuing any virtual cards.
        Fields already stored on the customer's profile may be omitted.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id:
                  type: string
                  format: uuid
                user_photo:
                  type: string
                  description: Base64 or URL. Required if not on customer profile.
                idType:
                  type: string
                  enum: [passport, drivers_license, national_id]
                  description: Required for Nigerian customers.
                customer_idFront:
                  type: string
                customer_idNumber:
                  type: string
                customer_address:
                  type: object
                  properties:
                    country:
                      type: string
                      description: ISO 3166-1 alpha-2.
                    city:
                      type: string
                    state:
                      type: string
                    zipcode:
                      type: string
                    street:
                      type: string
                    number:
                      type: string
      responses:
        '200':
          description: Customer registered for virtual cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string
                    example: User registered successfully.

  /customer/virtual/cards/create:
    post:
      tags: [Virtual Cards]
      summary: Create Virtual Card
      description: |
        Issues a virtual card for an activated customer. The initial funding amount is debited
        from your USD wallet. Minimum $3.00, maximum $10,000.00.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, amount]
              properties:
                customer_id:
                  type: string
                  format: uuid
                amount:
                  type: number
                  minimum: 3
                  maximum: 10000
                  description: Initial funding amount in USD.
      responses:
        '201':
          description: Virtual card created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualCard'

  /customer/virtual/cards/list:
    get:
      tags: [Virtual Cards]
      summary: List Virtual Cards
      description: Returns all virtual cards issued under your business account.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of virtual cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VirtualCard'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /customer/virtual/cards/get/{card_id}:
    get:
      tags: [Virtual Cards]
      summary: Get Virtual Card
      description: Returns full details for a specific virtual card.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Virtual card details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/VirtualCard'

  /customer/virtual/cards/topup:
    post:
      tags: [Virtual Cards]
      summary: Top Up Card
      description: |
        Adds funds to a virtual card. Amount is always debited from your USD wallet.
        Minimum $1.00, maximum $10,000.00.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                cardId:
                  type: string
                  description: Virtual card ID. Either cardId or card_id required.
                card_id:
                  type: string
                  description: Virtual card ID. Either cardId or card_id required.
                amount:
                  type: number
                  minimum: 1
                  maximum: 10000
      responses:
        '200':
          description: Card topped up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                      amount_added:
                        type: string
                      new_balance:
                        type: string
                      currency:
                        type: string

  /customer/virtual/cards/update/{card_id}:
    put:
      tags: [Virtual Cards]
      summary: Freeze / Unfreeze Card
      description: |
        Freeze or unfreeze a virtual card. A frozen card declines all transactions until unfrozen.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [freeze, unfreeze]
      responses:
        '200':
          description: Card status updated
          content:
            application/json:
              schema:
                type: object

  /customer/virtual/cards/transactions/{card_id}:
    get:
      tags: [Virtual Cards]
      summary: Card Transactions
      description: Returns all transactions made with a specific virtual card.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Card transaction history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transaction_id:
                          type: string
                        amount:
                          type: string
                        currency:
                          type: string
                        merchant_name:
                          type: string
                        merchant_category:
                          type: string
                        status:
                          type: string
                        created_at:
                          type: string
                          format: date-time

  /customer/virtual/cards/withdraw:
    post:
      tags: [Virtual Cards]
      summary: Withdraw from Card
      description: |
        Moves funds from a virtual card back to your USD wallet balance.
        Minimum $1.00.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId, amount]
              properties:
                cardId:
                  type: string
                amount:
                  type: number
                  minimum: 1
      responses:
        '200':
          description: Withdrawal successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                      amount_withdrawn:
                        type: string
                      new_card_balance:
                        type: string
                      currency:
                        type: string

  /customer/virtual/cards/terminate:
    post:
      tags: [Virtual Cards]
      summary: Terminate Card
      description: |
        Permanently terminates a virtual card. This action is irreversible.
        Withdraw any remaining balance before terminating.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId]
              properties:
                cardId:
                  type: string
      responses:
        '200':
          description: Card terminated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      card_id:
                        type: string
                      status:
                        type: string
                        example: terminated

  # ============================================================
  # PAYOUTS
  # ============================================================

  /payout/simple:
    post:
      tags: [Payouts]
      summary: Single Payout
      description: |
        Send a single payment to a saved beneficiary. Debits your wallet immediately on submission.
        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debit_wallet, amount, beneficiary_details_id, customer_id]
              properties:
                debit_wallet:
                  type: string
                  description: Source wallet currency (e.g. USD, EUR).
                  example: USD
                amount:
                  type: number
                  description: Amount to send in debit wallet currency.
                  example: 250
                beneficiary_details_id:
                  type: integer
                  description: Saved beneficiary payment method ID.
                customer_id:
                  type: string
                  description: The customer the payout is for. If the beneficiary belongs to a customer, it must be that customer.
                  example: da44a3e6-eb5d-429f-8d17-357aa5a6cdf2
                beneficiary_id:
                  type: string
                  description: Optional. The beneficiary that owns the payment method.
                quote_id:
                  type: string
                  format: uuid
                  description: A payout quote from POST /exchange-rate. Supplies the amount.
                reference:
                  type: string
                  maxLength: 250
                  description: Payment reference passed to the recipient's bank. Some payout rails shorten it or remove unsupported characters.
                invoice:
                  type: string
                  format: binary
                  description: Supporting invoice (PDF, PNG or JPEG, up to 15 MB). Send as multipart/form-data.
                invoice_url:
                  type: string
                  format: uri
                  description: Public http(s) link to the supporting invoice, as an alternative to invoice.
      responses:
        '200':
          description: Payout initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                      status:
                        type: string
                      amount:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '400':
          description: Insufficient wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payout/batch:
    post:
      tags: [Payouts]
      summary: Batch Payout
      description: |
        Submit an array of payouts in one request. Each item is processed independently —
        partial failures appear in an `errors` object without rolling back successful items.
        If wallet balance is insufficient for the total, the entire batch is rejected before
        any item is processed. Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payouts]
              properties:
                payouts:
                  type: array
                  items:
                    type: object
                    required: [amount, beneficiary_details_id]
                    properties:
                      amount:
                        type: number
                      beneficiary_details_id:
                        type: integer
                      beneficiary_id:
                        type: integer
      responses:
        '200':
          description: Batch submitted (may include partial failures)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    description: Object keyed by index with payout results.
        '400':
          description: Insufficient balance or partial failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payout/get:
    get:
      tags: [Payouts]
      summary: List Payouts
      description: Returns a paginated list of all payouts.
      responses:
        '200':
          description: Paginated payout list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutRecord'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /payout/fetch/{payout_id}:
    get:
      tags: [Payouts]
      summary: Get Payout
      description: Returns details for a specific payout by ID.
      parameters:
        - name: payout_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payout details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PayoutRecord'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # CURRENCY SWAP
  # ============================================================

  /wallet/swap/pairs:
    get:
      tags: [Currency Swap]
      summary: List Swap Pairs
      description: |
        Every currency pair you can swap between your own wallets, with its current rate, fees and amount limits.

        Team members need the **Wallets → view** permission.
      responses:
        '200':
          description: Swap pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletSwapPair'

  /wallet/swap/quote:
    post:
      tags: [Currency Swap]
      summary: Quote Swap
      description: |
        Price a swap without moving money. The fee is charged in `from_currency` and deducted before conversion:
        `to_amount = (amount − fee) × rate`, rounded down to the destination currency's decimal places.

        A quote doesn't reserve the rate or your balance.

        Team members need the **Wallets → view** permission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletSwapRequest'
      responses:
        '200':
          description: Swap quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      from_currency:
                        type: string
                        example: USD
                      to_currency:
                        type: string
                        example: USDC
                      from_amount:
                        type: number
                        description: Amount debited from the source wallet, including the fee.
                        example: 1000
                      fee:
                        type: number
                        description: Fee in `from_currency`.
                        example: 5
                      net_amount:
                        type: number
                        description: "`from_amount` minus `fee`. The amount converted."
                        example: 995
                      rate:
                        type: number
                        example: 1
                      to_amount:
                        type: number
                        description: Amount credited to the destination wallet.
                        example: 995
                      available_balance:
                        type: number
                        description: Your current balance in the source wallet.
                        example: 2500
        '422':
          description: Validation error, pair not available, amount outside the pair's limits, or no source wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet/swap:
    get:
      tags: [Currency Swap]
      summary: List Swaps
      description: |
        Your swaps, newest first, 10 per page by default.

        Team members need the **Wallets → view** permission.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Paginated swaps
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WalletSwap'
                      per_page:
                        type: integer
                        example: 10
                      last_page:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 1
    post:
      tags: [Currency Swap]
      summary: Run Swap
      description: |
        Debit the source wallet and credit the destination wallet in one step. If the credit fails, the debit is reversed.
        If you don't have a wallet in `to_currency`, it's created.

        Retrying with the same `Idempotency-Key` returns the original swap and doesn't swap again.

        Your USDC wallet can only be credited from USD, and can't be swapped out of. Those swaps fail with `Invalid wallet selected.`

        Team members need the **Wallets → manage** permission.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletSwapRequest'
      responses:
        '200':
          description: Swap completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/WalletSwap'
        '422':
          description: Validation error, pair not available, amount outside the pair's limits, insufficient balance, or invalid wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet/swap/{reference}:
    get:
      tags: [Currency Swap]
      summary: Get Swap
      description: |
        A single swap by the `reference` returned when you ran it.

        Team members need the **Wallets → view** permission.
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            example: 9b1f0c52-3a8e-4f4e-b2a1-6f0e5d7c8a91
      responses:
        '200':
          description: Swap
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Request successful
                  data:
                    $ref: '#/components/schemas/WalletSwap'
        '404':
          description: Swap not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # WEBHOOKS
  # ============================================================

  /business/webhook:
    get:
      tags: [Webhooks]
      summary: List Webhooks
      description: Returns all configured webhook endpoints for your business account.
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookRecord'

    post:
      tags: [Webhooks]
      summary: Create Webhook
      description: |
        Register a URL to receive webhook notifications. Yativo signs every request with an
        `Signature` header (HMAC-SHA256 of raw body using your webhook secret).

        **Supported events:** `deposit.created`, `deposit.updated`, `deposit.completed`,
        `payout.updated`, `payout.completed`, `customer.created`, `customer.kyc.approved`,
        `customer.kyc.rejected`, `virtual_account.deposit`, `virtual_account.funded`.

        Requires an `Idempotency-Key` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS URL of your webhook endpoint. Must be publicly accessible.
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                      secret:
                        type: string
                        description: Store securely. Used to verify the Signature header.
                      created_at:
                        type: string
                        format: date-time

  /business/webhook/{webhook_id}:
    put:
      tags: [Webhooks]
      summary: Update Webhook
      description: Update an existing webhook endpoint URL.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                type: object

    delete:
      tags: [Webhooks]
      summary: Delete Webhook
      description: |
        Delete a webhook endpoint. Yativo stops delivering events to this URL immediately.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /business/webhook/{webhook_id}/regenerate-secret:
    post:
      tags: [Webhooks]
      summary: Regenerate Webhook Secret
      description: |
        Issue a new HMAC signing secret for an existing webhook. The old secret is invalidated
        immediately — update `YATIVO_WEBHOOK_SECRET` in your environment right away.
        The new secret is shown only once.
        Requires an `Idempotency-Key` header.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New secret issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  status_code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      webhook_id:
                        type: string
                      secret:
                        type: string
                        description: New HMAC secret. Shown once only.
                      updated_at:
                        type: string
                        format: date-time

  # ============================================================
  # IP WHITELIST
  # ============================================================

  /ip-whitelist/check:
    get:
      tags: [IP Whitelist]
      summary: Check IP Whitelist
      description: |
        Shows the IP Yativo sees for your request and whether it can use your API key.
        Never blocks the request. Call it from the server that uses the key. Limited to 30 requests a minute.
      parameters:
        - name: ip
          in: query
          required: false
          description: Check this IP against your whitelist instead of the detected one. `key_usage` still describes the calling server.
          schema:
            type: string
            example: 198.51.100.7
      responses:
        '200':
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      key_usage:
                        type: object
                        properties:
                          authenticated_with_api_key:
                            type: boolean
                          key:
                            type: string
                            example: yativo_pk_9f1c2a...
                          request_ip:
                            type: string
                            example: 203.0.113.10
                          allowed_server:
                            type: boolean
                            nullable: true
                            description: Whether the calling server can use this key. `null` when not called with an API key.
                          matched_entry:
                            type: string
                            nullable: true
                            example: 203.0.113.10
                          message:
                            type: string
                      result:
                        type: string
                        enum: [pass, fail]
                      summary:
                        type: string
                        example: 203.0.113.10 passes the IP whitelist.
                      tested_ip:
                        type: string
                        example: 203.0.113.10
                      tested_ip_source:
                        type: string
                        enum: [detected, query]
                      network:
                        type: object
                        properties:
                          detected_ip:
                            type: string
                            example: 203.0.113.10
                          warning:
                            type: string
                            nullable: true
                            description: Set when your request reached Yativo through a proxy, so `detected_ip` may be the proxy's IP. Contact support if `detected_ip` isn't your server's public IP.
                      api_key:
                        type: object
                        nullable: true
                        description: How `tested_ip` compares with this key's whitelist. `null` when not called with an API key.
                        properties:
                          key:
                            type: string
                            example: yativo_pk_9f1c2a...
                          label:
                            type: string
                            example: Production backend
                          key_allowed_ips:
                            type: array
                            items:
                              type: string
                            description: IPs listed on this key.
                          account_whitelisted_ips:
                            type: array
                            items:
                              type: string
                            description: IPs from **Profile → Whitelist** that also apply to this key.
                          matched_entry:
                            type: string
                            nullable: true
                          would_allow:
                            type: boolean
                          would_return:
                            type: object
                            nullable: true
                            description: The error a request from `tested_ip` would get. `null` when allowed.
                            properties:
                              http_status:
                                type: integer
                                example: 403
                              error:
                                type: string
                                example: This IP address is not allowed to use this API key.
                      sitewide:
                        type: object
                        description: How `tested_ip` compares with your account IP whitelist.
                        properties:
                          account_whitelisted_ips:
                            type: array
                            items:
                              type: string
                          matches_own_account_ip:
                            type: boolean
                          would_allow:
                            type: boolean
                          would_return:
                            type: object
                            nullable: true
                            properties:
                              http_status:
                                type: integer
                              error:
                                type: string
        '401':
          description: Missing or invalid API credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The `ip` query parameter isn't a valid IP address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login-history:
    get:
      tags: [Account Security]
      summary: Login History
      description: |
        Sign-in history for the account, newest first, with signals that make a sign-in worth a second look
        (new IP, new device, new country, failed attempts beforehand). Failed requests with a wrong API secret
        or a revoked API key also appear here, with `auth_method` set to `api_key`.

        Called with an API key, this returns the business account owner's history. Limited to 30 requests a minute.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [successful, failed, active]
          description: '`active` returns sessions that are still signed in.'
        - name: flagged
          in: query
          schema:
            type: boolean
          description: Only return sign-ins flagged as suspicious.
        - name: ip
          in: query
          schema:
            type: string
          description: Only return sign-ins from this IP.
        - name: from
          in: query
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          schema:
            type: string
            format: date
          example: '2026-10-31'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Records retrieved successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 4182
                        ip_address:
                          type: string
                          example: 203.0.113.10
                        user_agent:
                          type: string
                        auth_method:
                          type: string
                          nullable: true
                          enum: [magic_link, passkey, password, social, api_key]
                          description: '`password` is the legacy Account ID and App Secret login.'
                        device:
                          type: object
                          properties:
                            name:
                              type: string
                              example: Chrome on macOS
                            browser:
                              type: string
                              nullable: true
                              example: Chrome
                            platform:
                              type: string
                              nullable: true
                              example: macOS
                            type:
                              type: string
                              nullable: true
                              enum: [desktop, mobile, tablet, automated]
                        location:
                          type: object
                          nullable: true
                          description: Approximate location from the IP address.
                        login_successful:
                          type: boolean
                        is_active:
                          type: boolean
                          description: Whether this session is still signed in.
                        is_trusted:
                          type: boolean
                        login_at:
                          type: string
                          format: date-time
                        logout_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_activity_at:
                          type: string
                          format: date-time
                          nullable: true
                        suspicious:
                          type: boolean
                          description: '`true` when `risk_level` is `medium` or `high`.'
                        risk_level:
                          type: string
                          enum: [low, medium, high]
                        risk_score:
                          type: integer
                          minimum: 0
                          maximum: 100
                        flags:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                enum: [failed_login, flagged_by_system, new_ip, new_device, new_country, automated_client, preceded_by_failed_attempts]
                              message:
                                type: string
                                example: First login from IP 203.0.113.10.
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Missing or invalid API credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # DEVELOPER
  # ============================================================

  /business/logs/all:
    get:
      tags: [Developer]
      summary: API Request Logs
      description: |
        Returns an audit log of all API calls made against your business account.
        Useful for debugging, monitoring, and compliance.
